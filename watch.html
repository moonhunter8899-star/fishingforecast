<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Bite Forecast">
<meta name="theme-color" content="#0b2231">
<title>Bite Forecast · Watch</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }
  body {
    background: linear-gradient(180deg, #0e2a3f 0%, #0b2231 45%, #081824 100%);
    background-attachment: fixed;
    color: #fff; min-height: 100vh;
    font-family: -apple-system, "Segoe UI", "Public Sans", sans-serif;
    font-variant-numeric: tabular-nums;
  }
  .wrap { max-width: 430px; margin: 0 auto; padding: 12px 14px 30px; }
  .top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .home { color: rgba(255,255,255,.75); text-decoration: none; font-size: 14px; font-weight: 600; }
  .wtitle { font-size: 12px; letter-spacing: .22em; color: rgba(255,255,255,.5); font-weight: 700; }
  .tabs { display: flex; gap: 8px; margin-bottom: 16px; }
  .tab {
    flex: 1; text-align: center; padding: 10px 0; border-radius: 999px;
    background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.12);
    color: rgba(255,255,255,.75); font-size: 14px; font-weight: 700; cursor: pointer;
  }
  .tab.on { background: rgba(56,198,244,.18); border-color: rgba(56,198,244,.55); color: #8ff0ff; }
  .hero { text-align: center; padding: 8px 0 2px; }
  .rword {
    font-size: 64px; font-weight: 900; letter-spacing: .02em; line-height: 1;
    text-shadow: 0 0 26px currentColor;
  }
  .rscore { font-size: 40px; font-weight: 900; margin-top: 2px; text-shadow: 0 0 18px currentColor; }
  .spot { margin-top: 8px; font-size: 14px; color: rgba(255,255,255,.78); font-weight: 600; }
  .bite {
    margin: 12px auto 0; display: inline-block; padding: 9px 18px; border-radius: 999px;
    background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.14);
    font-size: 14px; font-weight: 800; color: #ffd9a8;
  }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 16px; }
  .box {
    background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.1);
    border-radius: 16px; padding: 12px 13px; backdrop-filter: blur(6px);
  }
  .box .k { font-size: 11px; letter-spacing: .14em; color: rgba(255,255,255,.55); font-weight: 700; margin-bottom: 5px; }
  .box .v { font-size: 16px; font-weight: 800; line-height: 1.35; }
  .box .v small { font-size: 12.5px; font-weight: 600; color: rgba(255,255,255,.65); }
  .meta { text-align: center; margin-top: 14px; font-size: 12px; color: rgba(255,255,255,.45); }
  .meta.stale { color: #ffcf7a; }
  .meta a { color: #8ff0ff; }
  .empty {
    text-align: center; padding: 46px 20px; color: rgba(255,255,255,.75);
    background: rgba(255,255,255,.05); border-radius: 18px; border: 1px solid rgba(255,255,255,.1);
    margin-top: 20px; line-height: 1.6; font-size: 15px;
  }
  .empty a { color: #8ff0ff; font-weight: 700; }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <a class="home" href="index.html">‹ Home</a>
    <div class="wtitle">WATCH</div>
    <div style="width:52px"></div>
  </div>
  <div class="tabs" id="tabs"></div>
  <div id="view"></div>
  <div class="meta" id="meta"></div>
</div>
<script>
(function() {
  var SPECIES = [
    { id: "pompano", name: "Pompano", page: "pompano.html" },
    { id: "snook", name: "Snook", page: "snook.html" },
    { id: "mackerel", name: "Mackerel", page: "mackerel.html" }
  ];
  var sp = "pompano";
  try { sp = localStorage.getItem("ff_watch_species") || "pompano"; } catch (e) {}
  if (!SPECIES.some(function(s) { return s.id === sp; })) sp = "pompano";

  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"]/g, function(c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  function hourLabel(ms) {
    var d = new Date(ms), h = d.getHours(), ap = h >= 12 ? "PM" : "AM";
    h = h % 12; if (h === 0) h = 12;
    var m = d.getMinutes(); return h + (m ? ":" + (m < 10 ? "0" : "") + m : "") + " " + ap;
  }
  function dur(ms) {
    if (ms < 0) ms = 0;
    var m = Math.round(ms / 60000), h = Math.floor(m / 60);
    m = m % 60;
    return h > 0 ? h + "h " + m + "m" : m + "m";
  }
  function ago(ms) {
    var s = Math.floor(ms / 1000);
    if (s < 60) return "just now";
    var m = Math.floor(s / 60);
    if (m < 60) return m + "m ago";
    return Math.floor(m / 60) + "h " + (m % 60) + "m ago";
  }
  function snap(id) {
    try {
      var raw = localStorage.getItem("ff_watch_" + id);
      return raw ? JSON.parse(raw) : null;
    } catch (e) { return null; }
  }

  var tabsEl = document.getElementById("tabs"),
      viewEl = document.getElementById("view"),
      metaEl = document.getElementById("meta");

  function renderTabs() {
    tabsEl.innerHTML = SPECIES.map(function(s) {
      return '<div class="tab' + (s.id === sp ? " on" : "") + '" data-sp="' + s.id + '">' + s.name + "</div>";
    }).join("");
    var els = tabsEl.querySelectorAll("[data-sp]");
    for (var i = 0; i < els.length; i++) (function(el) {
      el.addEventListener("click", function() {
        sp = el.getAttribute("data-sp");
        try { localStorage.setItem("ff_watch_species", sp); } catch (e) {}
        render();
      });
    })(els[i]);
  }

  function biteLine(d) {
    var now = Date.now();
    if (d.bestStart == null || d.bestEnd == null) return "—";
    if (now >= d.bestStart && now <= d.bestEnd)
      return '<span style="color:#7dffb0">● NOW</span>';
    if (d.bestEnd <= now) return "—";
    return "in " + dur(d.bestStart - now);
  }

  function render() {
    renderTabs();
    var d = snap(sp);
    var spInfo = SPECIES.filter(function(s) { return s.id === sp; })[0];
    if (!d) {
      viewEl.innerHTML = '<div class="empty">No ' + esc(spInfo.name) +
        ' data on this device yet.<br>Open the <a href="' + spInfo.page + '">' + esc(spInfo.name) +
        ' forecast</a> once — this glance view will light up after.</div>';
      metaEl.textContent = "";
      return;
    }
    var col = d.color || "#1d9e6c";
    var tideV = d.tideH == null ? "—"
      : d.tideH.toFixed(1) + " ft <small>" + (d.tideDir > 0 ? "▲ Rising" : d.tideDir < 0 ? "▼ Falling" : "") + "</small>";
    var bitesV = (d.nextMajor == null && d.nextMinor == null) ? "—"
      : "<small>Major</small> " + (d.nextMajor == null ? "—" : hourLabel(d.nextMajor)) +
        "<br><small>Minor</small> " + (d.nextMinor == null ? "—" : hourLabel(d.nextMinor));
    var windV = (d.wind == null ? "—" : Math.round(d.wind) +
      (d.gust != null ? " | " + Math.round(d.gust) : "") + " <small>" + esc(d.windDir || "") + "</small>");
    viewEl.innerHTML =
      '<div class="hero">' +
        '<div class="rword" style="color:' + esc(col) + '">' + esc(String(d.word || "").toUpperCase()) + "</div>" +
        '<div class="rscore" style="color:' + esc(col) + '">' + d.score + "</div>" +
        '<div class="spot">' + esc(d.loc || "") + "</div>" +
        '<div><span class="bite">◷ BEST BITE ' + biteLine(d) + "</span></div>" +
      "</div>" +
      '<div class="grid">' +
        '<div class="box"><div class="k">TIDE</div><div class="v">' + tideV + "</div></div>" +
        '<div class="box"><div class="k">BITES</div><div class="v">' + bitesV + "</div></div>" +
        '<div class="box"><div class="k">WIND</div><div class="v">' + windV + "</div></div>" +
        '<div class="box"><div class="k">RAIN</div><div class="v">' + (d.rain == null ? "—" : d.rain + "<small>%</small>") + "</div></div>" +
      "</div>";
    var ageMs = Date.now() - d.at, stale = ageMs > 3 * 3600000;
    metaEl.className = "meta" + (stale ? " stale" : "");
    metaEl.innerHTML = "Updated " + ago(ageMs) +
      (stale ? ' · <a href="' + spInfo.page + '">refresh on the ' + esc(spInfo.name) + ' page →</a>' : "");
  }

  render();
  setInterval(render, 30000);
})();
</script>
</body>
</html>
