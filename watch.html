<title>Pompano Watch — Tien Huynh</title>
<style>

  .loc { font-weight: 800; font-size: 14px; }

    background: #fffaf0; border: 1.5px solid #d9c9a3; border-radius: 999px;

  .langbtn b { color: #9a4a16; }

  .badge {

    display: flex; align-items: center; justify-content: center;
  }
  .rword { font-weight: 900; font-size: 34px; letter-spacing: .02em; line-height: 1; }

  .cd .note { color: #8a7a5f; font-weight: 600; }

</head>

  function X(tt) { return pL + (tt - d0) / 86400000 * (W - pL - pR); }
  function Y(v) { return pT + (1 - (v - mn) / (mx - mn)) * (H - pT - pB); }
  var d = "M" + X(pts[0][0]).toFixed(1) + "," + Y(pts[0][1]).toFixed(1);
  for (var i = 0; i < pts.length - 1; i++) {
    var p0 = pts[Math.max(0, i - 1)], p1 = pts[i], p2 = pts[i + 1], p3 = pts[Math.min(pts.length - 1, i + 2)];
    var c1x = X(p1[0]) + (X(p2[0]) - X(p0[0])) / 6, c1y = Y(p1[1]) + (Y(p2[1]) - Y(p0[1])) / 6;
    var c2x = X(p2[0]) - (X(p3[0]) - X(p1[0])) / 6, c2y = Y(p2[1]) - (Y(p3[1]) - Y(p1[1])) / 6;
    d += "C" + c1x.toFixed(1) + "," + c1y.toFixed(1) + " " + c2x.toFixed(1) + "," + c2y.toFixed(1) +
         " " + X(p2[0]).toFixed(1) + "," + Y(p2[1]).toFixed(1);
  }
  var svg = '<svg viewBox="0 0 ' + W + " " + H + '">';
  svg += '<defs><linearGradient id="wtideg" x1="0" y1="0" x2="0" y2="1">' +
    '<stop offset="0" stop-color="#14b8a6" stop-opacity=".30"/>' +
    '<stop offset=".6" stop-color="#14b8a6" stop-opacity=".10"/>' +
    '<stop offset="1" stop-color="#14b8a6" stop-opacity=".03"/>' +
    "</linearGradient></defs>";
  svg += '<rect x="0" y="0" width="' + W + '" height="' + H + '" rx="12" fill="#f8f2e3"/>';
  svg += '<path d="' + d + " L" + X(d1).toFixed(1) + "," + (H - pB) + " L" + X(d0).toFixed(1) + "," + (H - pB) +
    '" fill="url(#wtideg)" stroke="none"/>';
  svg += '<path d="' + d + '" fill="none" stroke="#14b8a6" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round"/>';
  T.forEach(function(e) {
    if (e.t < d0 || e.t > d1) return;
    svg += '<circle cx="' + X(e.t).toFixed(1) + '" cy="' + Y(e.v).toFixed(1) +
      '" r="4" fill="#fff" stroke="#0f766e" stroke-width="1.75"/>';
  });
  var now = Date.now();
  var nc = state.today ? ratingColor(state.today.score) : "#1d9e6c";
  // small Major fish markers at each Major window's midpoint (skipped quietly if moon data failed)
  (state.moon || []).forEach(function(w) {
    if (w.type !== "major") return;
    var mid = (w.start + w.end) / 2;
    if (mid < d0 || mid > d1) return;
    svg += '<g transform="translate(' + (X(mid) - 7.5).toFixed(1) + "," + (Y(tideAt(mid)) - 7.5).toFixed(1) + ')">' + fishSVG(nc, 15) + "</g>";
  });
  // small cartoon rod riding the curve at the current time, with the day's
  // rating number (rating color) above and the live time between rod and number
  if (now >= d0 && now <= d1 && state.today) {
    var nx = X(now), ny = Y(tideAt(now));
    // keep the labels inside the chart horizontally (rod itself stays exact)
    var lx = (Math.min(Math.max(nx, 28), W - 28) - nx).toFixed(1);
    svg += '<g transform="translate(' + nx.toFixed(1) + "," + ny.toFixed(1) + ')">' +
      '<text x="' + lx + '" y="-23" text-anchor="middle" font-size="10.5" font-weight="700" fill="' + nc + '">' + state.today.score + "</text>" +
      '<text x="' + lx + '" y="-13.5" text-anchor="middle" font-size="8" fill="#8a7a5f">' + clockStr(state.lang) + "</text>" +
      '<g transform="scale(0.45)">' +
      '<path d="M-17.5,17.5 L-9.5,9.5" stroke="#161616" stroke-width="8.6" stroke-linecap="round"/>' +
      '<path d="M-17.5,17.5 L-9.5,9.5" stroke="#7c4f30" stroke-width="6.2" stroke-linecap="round"/>' +
      '<polygon points="-11.2,14.8 -14.8,11.2 14.2,-15.8 15.8,-14.2" fill="#b07a52" stroke="#161616" stroke-width="1.4" stroke-linejoin="round"/>' +
      '<path d="M-4.5,7.6 L-5.4,5.8" stroke="#161616" stroke-width="1.6"/>' +
      '<circle cx="-4.5" cy="12" r="4.6" fill="#e9f2ff" stroke="#161616" stroke-width="1.6"/>' +
      '<circle cx="-4.5" cy="12" r="2" fill="#1f2937"/>' +
      '<path d="M-0.6,14.2 L2.8,16.2" stroke="#161616" stroke-width="1.6" stroke-linecap="round"/><circle cx="3.4" cy="16.5" r="1.5" fill="#1f2937"/>' +
      '<circle cx="-1.8" cy="1.8" r="1.7" fill="#fffdf7" stroke="#161616" stroke-width="1.3"/>' +
      '<circle cx="4.4" cy="-4.4" r="1.7" fill="#fffdf7" stroke="#161616" stroke-width="1.3"/>' +
      '<circle cx="10.5" cy="-10.5" r="1.7" fill="#fffdf7" stroke="#161616" stroke-width="1.3"/>' +
      '<path d="M-4.5,7.4 L-1.8,1.8 L4.4,-4.4 L10.5,-10.5 L15,-15 C16.5,-9 12,-2.5 3.5,-0.5" stroke="#161616" stroke-width="1.1" fill="none" stroke-linecap="round"/>' +
      '<circle cx="5.5" cy="-1.1" r="2" fill="#f472a0" stroke="#161616" stroke-width="1"/>' +
      '<path d="M3.5,-0.5 L3.5,3.5 Q3.5,6 1,6 Q-1,6 -1,4" stroke="#161616" stroke-width="1.4" fill="none" stroke-linecap="round"/>' +
      "</g></g>";
  }
  svg += '<text x="' + (W - pR - 2) + '" y="' + (pT - 3) + '" text-anchor="end" font-size="8.5" fill="#a89a7c">ft</text>';
  return svg + "</svg>";
}
function renderAll() {
  var S = STR[state.lang], lang = state.lang;
  $("langBtn").innerHTML = lang === "en" ? "<b>EN</b> | VI" : "EN | <b>VI</b>";
  if (!state.ready || !state.today) return;
  var t = state.today, c = ratingColor(t.score);
  var html = "";
  html += '<div class="rcard" style="border-color:' + c + '">' +
    '<div class="rlbl">' + S.rating + "</div>" +
    '<div class="rrow"><div class="badge">' + fishSVG(c, 40) + "</div>" +
    '<div><div class="rword">' + ratingWord(t.score, lang).toUpperCase() + "</div>" +
    '<div class="rscore" style="color:' + c + '">' + t.score + "/100</div></div></div></div>";
  if (t.best) {
    var bc = ratingColor(t.best.score);
    html += '<div class="gofish"><span>🎣 ' + S.goFish + "</span><span>" +
      trange(t.best.start, t.best.end, lang) + '</span><span class="gs">' +
      fishSVG(bc, 24) + " " + t.best.score + "</span></div>";
  }
  html += '<div class="tidecard">' + tideChartSVG() + "</div>";
  html += '<div class="cd"><span class="ck">🌊</span><span id="tideCd">' + tideCountdowns() + "</span></div>";
  html += '<div class="cd"><span class="ck">🌙</span><span id="moonCd">' + moonCountdowns() + "</span></div>";
  html += '<div class="upd">' + S.updated(clockStr(lang)) + "</div>";
  $("app").innerHTML = html;
}
function tick() {
  if (!state.ready) return;
  renderAll();
}
function showError() {
  var S = STR[state.lang];
  $("app").innerHTML = '<div class="err">' + S.loadFail +
    '<br><button class="refresh" onclick="boot()">' + S.retry + "</button></div>";
}
function boot() {
  state.ready = false; state.today = null;
  var S = STR[state.lang];
  document.documentElement.lang = state.lang;
  $("langBtn").innerHTML = state.lang === "en" ? "<b>EN</b> | VI" : "EN | <b>VI</b>";
  $("app").innerHTML = '<div class="loading">' + S.loading + "</div>";
  var lat = PIN.lat, lon = PIN.lon;
  var fromD = new Date(); fromD.setDate(fromD.getDate() - 1);
  var toD = new Date(); toD.setDate(toD.getDate() + 3);
  var moonPs = [];
  for (var i = 0; i < 3; i++) {
    var dt = new Date(); dt.setDate(dt.getDate() + i);
    moonPs.push(loadMoonDay(lat, lon, dt));
  }
  // Per-source isolation: weather+marine are essential; tides and moon degrade quietly.
  Promise.all([
    loadWeather(lat, lon).catch(function(e) { return { _err: e }; }),
    loadMarine(lat, lon).catch(function(e) { return { _err: e }; }),
    loadTides(PIN.station, fromD, toD).catch(function() { return []; }),
    Promise.all(moonPs)
  ]).then(function(r) {
    try {
      if (r[0]._err || r[1]._err) { showError(); return; }
      state.wx = r[0]; state.mar = r[1];
      state.tides = r[2];
      var all = [];
      r[3].forEach(function(arr) { arr.forEach(function(w) { all.push(w); }); });
      state.moon = dedupeMoon(all);
      state.today = buildToday();
      state.ready = true;
      state.updatedAt = new Date();
      renderAll();
    } catch (e) { showError(); }
  }).catch(function() { showError(); });
}
$("langBtn").addEventListener("click", function() {
  state.lang = state.lang === "en" ? "vi" : "en";
  localStorage.setItem("pf_lang", state.lang);
  document.documentElement.lang = state.lang;
  if (state.ready) renderAll(); else boot();
});
boot();
setInterval(tick, 30000);
</script>
