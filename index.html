<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#f2f5f9">
<title>Fishing Forecast — Tien Huynh</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }
  body {
    background: #eef2f7; color: #16202b;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif;
    max-width: 430px; margin: 0 auto; padding: 12px 12px 32px;
  }
  h1 { font-size: 19px; margin: 4px 0 2px; }
  h1 .name { color: #0284c7; font-weight: 600; font-size: 15px; }
  .sub { color: #66788a; font-size: 12px; margin-bottom: 10px; }
  .strip { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin-bottom: 12px; }
  .dpill { background: #fff; border: 1px solid #e2e8f0; border-radius: 12px; padding: 8px 0; text-align: center; cursor: pointer; }
  .dpill .dn { font-size: 19px; font-weight: 800; }
  .dpill .dw { font-size: 11px; color: #66788a; }
  .dpill.sel { background: #1d9bf0; border-color: #1d9bf0; }
  .dpill.sel .dn, .dpill.sel .dw { color: #fff; }
  .card {
    background: #fff; border: 1px solid #e2e8f0; border-radius: 16px;
    padding: 14px; margin-bottom: 12px; box-shadow: 0 1px 2px rgba(15,30,45,.05);
  }
  .score-wrap { display: flex; align-items: center; justify-content: space-between; }
  .majmin { flex: 1; }
  .majmin .k { color: #66788a; font-size: 13px; margin-bottom: 6px; }
  .majmin .t { font-weight: 800; font-size: 14px; margin-bottom: 4px; font-variant-numeric: tabular-nums; }
  .dial { position: relative; width: 128px; height: 128px; flex: none; margin: 0 4px; }
  .dial .num { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    font-size: 34px; font-weight: 800; }
  .activity { text-align: center; color: #66788a; font-size: 14px; margin-top: 6px; }
  .counts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
  .count { background: #f1f5f9; border-radius: 10px; padding: 8px; text-align: center; }
  .count .k { font-size: 10px; text-transform: uppercase; letter-spacing: .5px; color: #66788a; }
  .count .v { font-size: 13px; font-weight: 800; margin-top: 2px; }
  .count .c { font-size: 12px; color: #0284c7; font-weight: 700; font-variant-numeric: tabular-nums; }
  .wx { display: flex; align-items: center; gap: 14px; }
  .wx .big { font-size: 44px; font-weight: 800; }
  .wx .hl { font-size: 15px; font-weight: 700; color: #334155; }
  .wx .hl span { color: #94a3b8; font-weight: 600; }
  .wxgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 12px; margin-left: auto; font-size: 14px; font-weight: 700; }
  .wxgrid .lab { color: #66788a; font-weight: 500; font-size: 12px; }
  .sec-t { font-size: 15px; font-weight: 800; margin-bottom: 8px; }
  .sec-t .r { float: right; font-weight: 500; color: #66788a; font-size: 13px; }
  .smrow { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .sunmoon .row { display: flex; justify-content: space-between; font-size: 14px; padding: 3px 0; }
  .sunmoon .row .k { color: #66788a; }
  .sunmoon .row .v { font-weight: 800; font-variant-numeric: tabular-nums; }
  .moonbig { display: flex; align-items: center; gap: 10px; margin: 6px 0 8px; }
  .moonbig .em { font-size: 44px; }
  .moonbig .pn { font-size: 17px; font-weight: 800; }
  .moonbig .il { color: #66788a; font-size: 13px; font-weight: 600; }
  .tidebig { font-size: 40px; font-weight: 800; }
  .tidebig .tr { font-size: 24px; }
  .tide-svg { width: 100%; height: 110px; display: block; margin-top: 6px; }
  .legend { font-size: 11px; color: #66788a; margin-top: 4px; }
  .bite { display: flex; align-items: center; gap: 8px; padding: 7px 0; font-size: 13px; border-top: 1px solid #eef2f7; }
  .bite:first-child { border-top: none; }
  .bite .t { font-weight: 700; }
  .bite .tag { color: #66788a; font-size: 11px; margin-left: auto; text-align: right; }
  .bite.next { background: #f0fdf4; margin: 0 -14px; padding: 7px 14px; border-top: none; }
  .err { color: #dc2626; font-size: 13px; }
  .loading { color: #66788a; text-align: center; padding: 40px 0; }
  .foot { color: #94a3b8; font-size: 11px; text-align: center; margin-top: 16px; }
  .foot a { color: #0284c7; }
</style>
</head>
<body>
<h1>🎣 Fishing Forecast <span class="name">· Tien Huynh</span></h1>
<div class="sub">Jupiter Inlet, FL · <span id="updated">loading…</span></div>
<div class="strip" id="strip"></div>
<div id="app"><div class="loading">Loading forecast…</div></div>
<div class="foot">Data: Open-Meteo · NOAA tides · USNO sun &amp; moon · Compare: <a href="https://tides4fishing.com/us/florida-east-coast/jupiter-inlet-south-jetty">tides4fishing</a><br>Rating is an estimate, not a guarantee.</div>

<script>
const LAT = 26.9166, LON = -80.0642, TZ = "America/New_York", STATION = "8722495";

function fishColor(s){ return s >= 60 ? "#22c55e" : s >= 40 ? "#eab308" : "#ef4444"; }
function fishIcon(s, size){
  size = size || 22;
  const c = fishColor(s);
  return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" style="vertical-align:-5px;flex:none">` +
    `<path d="M2.5 12C5.3 7.8 8.8 5.8 12.6 5.8c2.7 0 5.2 1.5 7.2 4.2l1.7 2-1.7 2c-2 2.7-4.5 4.2-7.2 4.2-3.8 0-7.3-2-10.1-6.2z" fill="${c}"/>` +
    `<circle cx="15.8" cy="10.6" r="1.2" fill="#fff"/></svg>`;
}

const MOON_EMOJI = { "New Moon": "🌑", "Waxing Crescent": "🌒", "First Quarter": "🌓", "Waxing Gibbous": "🌔",
  "Full Moon": "🌕", "Waning Gibbous": "🌖", "Last Quarter": "🌗", "Waning Crescent": "🌘" };
const moonEmoji = p => MOON_EMOJI[p] || "🌙";

const p2 = n => String(n).padStart(2, "0");
const fmtT12 = d => {
  let h = d.getHours(); const ap = h >= 12 ? "PM" : "AM"; h = h % 12 || 12;
  return h + ":" + p2(d.getMinutes()) + " " + ap;
};
const fmtRange12 = (a, b) => fmtT12(a) + " – " + fmtT12(b);
const dayKey = iso => iso.slice(0, 10);

function fishScore(d){
  let s = 0;
  s += d.windMax <= 10 ? 30 : d.windMax <= 15 ? 22 : d.windMax <= 20 ? 12 : 4;
  s += d.rainMax < 20 ? 20 : d.rainMax < 40 ? 14 : d.rainMax < 60 ? 8 : 3;
  s += (d.waterTemp >= 65 && d.waterTemp <= 80) ? 20 : (d.waterTemp >= 60 && d.waterTemp <= 85) ? 14 : 8;
  s += d.waveMax < 1.5 ? 15 : d.waveMax < 3 ? 10 : 5;
  s += d.tideRange >= 2 ? 15 : 8;
  return Math.min(100, Math.round(s));
}
function activityLabel(s){
  return s >= 80 ? "Very high activity" : s >= 60 ? "High activity" : s >= 40 ? "Average activity" : "Low activity";
}

function biteWindows(tides){
  return tides.map(p => {
    const c = new Date(p.t).getTime(), w = 90 * 60 * 1000;
    return { start: new Date(c - w), end: new Date(c + w), peak: new Date(p.t), type: p.type, hv: parseFloat(p.v) };
  });
}
function overlaps(a, b){
  return a.start.getTime() < b.end.getTime() && b.start.getTime() < a.end.getTime();
}
function bestWindow(wins){
  const now = Date.now();
  const up = wins.filter(w => w.end.getTime() > now);
  if (!up.length) return wins[0];
  const bm = up.filter(w => w.moonMajor);
  return bm.length ? bm[0] : up[0];
}

async function skyInfo(dateStr){
  try{
    const tzH = -new Date(dateStr + "T12:00:00").getTimezoneOffset() / 60;
    const r = await fetch(`https://aa.usno.navy.mil/api/rstt/oneday?date=${dateStr}&coords=${LAT},${LON}&tz=${tzH}`);
    const j = await r.json();
    const data = j.properties.data;
    const toD = hm => {
      const [h, m] = hm.split(":").map(Number);
      const d = new Date(dateStr + "T12:00:00"); d.setHours(h, m, 0, 0); return d;
    };
    const getPhen = (arr, phen) => (((arr || []).find(x => x.phen === phen) || {}).time);
    const H = 36e5, majors = [], minors = [];
    const upper = getPhen(data.moondata, "Upper Transit");
    if (upper){
      const u = toD(upper);
      majors.push({ start: new Date(u.getTime() - 2 * H), end: new Date(u.getTime() + 2 * H), label: "Moon overhead" });
      const l = new Date(u.getTime() + 12.42 * H);
      majors.push({ start: new Date(l.getTime() - 2 * H), end: new Date(l.getTime() + 2 * H), label: "Moon underfoot" });
    }
    const mr = getPhen(data.moondata, "Rise"), ms = getPhen(data.moondata, "Set");
    if (mr){ const t = toD(mr); minors.push({ start: new Date(t.getTime() - H), end: new Date(t.getTime() + H), label: "Moonrise" }); }
    if (ms){ const t = toD(ms); minors.push({ start: new Date(t.getTime() - H), end: new Date(t.getTime() + H), label: "Moonset" }); }
    const sr = getPhen(data.sundata, "Rise"), ss = getPhen(data.sundata, "Set");
    return {
      phase: data.curphase, illum: data.fracillum, majors, minors,
      sunrise: sr ? toD(sr) : null, sunset: ss ? toD(ss) : null,
      moonrise: mr ? toD(mr) : null, moonset: ms ? toD(ms) : null
    };
  }catch(e){ return null; }
}

async function load(){
  const fUrl = `https://api.open-meteo.com/v1/forecast?latitude=${LAT}&longitude=${LON}` +
    `&hourly=temperature_2m,precipitation_probability,wind_speed_10m,wind_direction_10m,pressure_msl,relative_humidity_2m` +
    `&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max,wind_speed_10m_max,wind_direction_10m_dominant,uv_index_max` +
    `&timezone=${encodeURIComponent(TZ)}&wind_speed_unit=mph&temperature_unit=fahrenheit&forecast_days=7`;
  const mUrl = `https://marine-api.open-meteo.com/v1/marine?latitude=${LAT}&longitude=${LON}` +
    `&hourly=sea_surface_temperature,wave_height&timezone=${encodeURIComponent(TZ)}` +
    `&temperature_unit=fahrenheit&forecast_days=7`;
  const now = new Date();
  const bd = now.toISOString().slice(0, 10).replace(/-/g, "");
  const ed = new Date(now.getTime() + 7 * 864e5).toISOString().slice(0, 10).replace(/-/g, "");
  const tUrl = `https://api.tidesandcurrents.noaa.gov/api/prod/datagetter?product=predictions&datum=MLLW` +
    `&station=${STATION}&time_zone=lst_ldt&units=english&interval=hilo&format=json&begin_date=${bd}&end_date=${ed}`;

  const [f, m, t] = await Promise.all([
    fetch(fUrl).then(r => r.json()),
    fetch(mUrl).then(r => r.json()),
    fetch(tUrl).then(r => r.json()).catch(() => ({ predictions: [] }))
  ]);

  const days = f.daily.time.map((date, i) => {
    const hrs = f.hourly.time.map((t2, j) => j).filter(j => dayKey(f.hourly.time[j]) === date);
    let waveMax = 0, waterNoon = null;
    m.hourly.time.map((t2, j) => j).filter(j => dayKey(m.hourly.time[j]) === date).forEach(j => {
      const wv = (m.hourly.wave_height[j] || 0) * 3.28084;
      if (wv > waveMax) waveMax = wv;
      if (Math.abs(new Date(m.hourly.time[j]).getHours() - 12) < 2 && waterNoon === null)
        waterNoon = m.hourly.sea_surface_temperature[j];
    });
    const at = j => {
      const hh = f.hourly;
      return {
        temp: Math.round(hh.temperature_2m[j]),
        rain: hh.precipitation_probability[j] ?? 0,
        wind: Math.round(hh.wind_speed_10m[j]),
        wdir: hh.wind_direction_10m[j],
        pres: Math.round(hh.pressure_msl[j]),
        hum: Math.round(hh.relative_humidity_2m[j])
      };
    };
    let cur = null;
    if (i === 0){
      let best = 1e15, bj = hrs[0];
      hrs.forEach(j => {
        const diff = Math.abs(new Date(f.hourly.time[j]).getTime() - Date.now());
        if (diff < best){ best = diff; bj = j; }
      });
      cur = at(bj);
    }
    const dayAvg = k => {
      const vs = hrs.map(j => f.hourly[k][j]).filter(v => v !== null && v !== undefined);
      return vs.length ? vs.reduce((a, b) => a + b, 0) / vs.length : null;
    };
    const tides = (t.predictions || []).filter(p => dayKey(p.t) === date);
    const hs = tides.map(p => parseFloat(p.v));
    const d = {
      date, i,
      tMax: Math.round(f.daily.temperature_2m_max[i]),
      tMin: Math.round(f.daily.temperature_2m_min[i]),
      rainMax: f.daily.precipitation_probability_max[i] ?? 0,
      windMax: Math.round(f.daily.wind_speed_10m_max[i] ?? 0),
      windDir: f.daily.wind_direction_10m_dominant[i] ?? 0,
      uvMax: Math.round(f.daily.uv_index_max[i] ?? 0),
      waterTemp: waterNoon !== null ? Math.round(waterNoon) : null,
      waveMax: Math.round(waveMax * 10) / 10,
      tideRange: hs.length ? Math.round((Math.max(...hs) - Math.min(...hs)) * 10) / 10 : 0,
      pres: cur ? cur.pres : Math.round(dayAvg("pressure_msl") ?? 0),
      hum: cur ? cur.hum : Math.round(dayAvg("relative_humidity_2m") ?? 0),
      curTemp: cur ? cur.temp : null,
      curRain: cur ? cur.rain : null,
      tides, hrs, wins: biteWindows(tides)
    };
    d.score = fishScore(d);
    d.good = d.score >= 60;
    return d;
  });

  const skies = await Promise.all(days.map(d => skyInfo(d.date)));
  days.forEach((d, i) => {
    d.sky = skies[i];
    d.wins.forEach(w => {
      w.moonMajor = d.sky ? d.sky.majors.some(mm => overlaps(w, mm)) : false;
      w.moonMinor = !w.moonMajor && d.sky ? d.sky.minors.some(mm => overlaps(w, mm)) : false;
    });
    if (d.wins.some(w => w.moonMajor)) d.score = Math.min(100, d.score + 10);
    d.good = d.score >= 60;
  });

  window.__days = days;
  renderStrip(0);
  render(0);
}

function tideAt(day, timeMs){
  const pts = day.tides.map(p => ({ t: new Date(p.t).getTime(), v: parseFloat(p.v) }));
  if (!pts.length) return null;
  if (timeMs <= pts[0].t) return { v: pts[0].v, dir: 0 };
  for (let k = 0; k < pts.length - 1; k++){
    const a = pts[k], b = pts[k + 1];
    if (timeMs >= a.t && timeMs <= b.t){
      const fr = (timeMs - a.t) / ((b.t - a.t) || 1);
      const v = a.v + (b.v - a.v) * (0.5 - 0.5 * Math.cos(Math.PI * fr));
      return { v, dir: b.v > a.v ? 1 : b.v < a.v ? -1 : 0 };
    }
  }
  return { v: pts[pts.length - 1].v, dir: 0 };
}

function tideSVG(day, highlight){
  const pts = day.tides.map(p => ({ t: new Date(p.t), v: parseFloat(p.v), type: p.type }));
  if (pts.length < 2) return `<div class="legend">Tide data unavailable.</div>`;
  const W = 340, H = 104, P = 8;
  const vs = pts.map(p => p.v), vMin = Math.min(...vs), vMax = Math.max(...vs), vR = (vMax - vMin) || 1;
  const t0 = pts[0].t.getTime(), t1 = pts[pts.length - 1].t.getTime(), tR = (t1 - t0) || 1;
  const X = t => P + (t - t0) / tR * (W - 2 * P);
  const Y = v => H - P - (v - vMin) / vR * (H - 2 * P);
  let dAttr = "";
  const N = 110;
  for (let k = 0; k <= N; k++){
    const tt = t0 + tR * k / N;
    let seg = 0;
    while (seg < pts.length - 2 && pts[seg + 1].t.getTime() < tt) seg++;
    const a = pts[seg], b = pts[seg + 1];
    const fr = (tt - a.t.getTime()) / ((b.t.getTime() - a.t.getTime()) || 1);
    const v = a.v + (b.v - a.v) * (0.5 - 0.5 * Math.cos(Math.PI * Math.min(1, Math.max(0, fr))));
    dAttr += (k ? "L" : "M") + X(tt).toFixed(1) + "," + Y(v).toFixed(1);
  }
  let shades = "";
  day.wins.forEach(w => {
    const isBest = highlight && w.peak.getTime() === highlight.peak.getTime();
    const x1 = X(Math.max(t0, w.start.getTime())), x2 = X(Math.min(t1, w.end.getTime()));
    if (x2 <= x1) return;
    shades += `<rect x="${x1.toFixed(1)}" y="${P}" width="${(x2 - x1).toFixed(1)}" height="${H - 2 * P}"` +
      ` fill="${isBest ? "#22c55e" : "#bbf7d0"}" opacity="${isBest ? "0.45" : "0.5"}" rx="4"/>`;
  });
  let marks = "";
  pts.forEach(p => {
    const x = X(p.t.getTime()), y = Y(p.v);
    marks += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3.5" fill="${p.type === "H" ? "#0284c7" : "#d97706"}"/>` +
      `<text x="${x.toFixed(1)}" y="${(y - 8).toFixed(1)}" fill="#334155" font-size="10" text-anchor="middle">${p.type} ${fmtT12(p.t).replace(" ", "")}</text>`;
  });
  let fish = "";
  if (highlight){
    const hx = X(highlight.peak.getTime());
    const c = fishColor(day.score);
    fish = `<g transform="translate(${hx.toFixed(1)},${P + 14})">` +
      `<path d="M-11,0C-7,-4.5 -3.5,-6.5 0.5,-6.5c2.7,0 5.2,1.5 7.2,4.2l1.8,2.3-1.8,2.3c-2,2.7-4.5,4.2-7.2,4.2-3.8,0-7.5,-2-11,-6.5z" fill="${c}"/>` +
      `<circle cx="4" cy="-1.5" r="1.1" fill="#fff"/></g>`;
  }
  const nowX = X(Date.now());
  const nowLine = (nowX > P && nowX < W - P)
    ? `<line x1="${nowX.toFixed(1)}" y1="${P}" x2="${nowX.toFixed(1)}" y2="${H - P}" stroke="#ef4444" stroke-width="1.5"/>` : "";
  return `<svg class="tide-svg" viewBox="0 0 ${W} ${H}">${shades}` +
    `<path d="${dAttr}" fill="none" stroke="#0284c7" stroke-width="2"/>${marks}${fish}${nowLine}</svg>` +
    `<div class="legend">🐟 = best bite · green = prime window · 🔴 = now</div>`;
}

let tickTimer = null;
function fmtCountdown(ms){
  const s = Math.max(0, Math.floor(ms / 1000));
  const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), ss = s % 60;
  return h ? `${h}h ${p2(m)}m ${p2(ss)}s` : `${m}m ${p2(ss)}s`;
}
function startTicks(){
  if (tickTimer) clearInterval(tickTimer);
  const days = window.__days;
  const today = days[0];
  function tick(){
    const tv = document.getElementById("cd-tide-v"), tc = document.getElementById("cd-tide-c");
    const bv = document.getElementById("cd-bite-v"), bc = document.getElementById("cd-bite-c");
    if (!tv || !bv) return;
    const now = Date.now();
    const nx = today.tides
      .map(p => ({ t: new Date(p.t).getTime(), type: p.type, v: parseFloat(p.v) }))
      .filter(p => p.t > now)[0];
    if (nx){
      tv.textContent = `${nx.type === "H" ? "High" : "Low"} ${fmtT12(new Date(nx.t))} · ${nx.v.toFixed(1)}ft`;
      tc.textContent = "in " + fmtCountdown(nx.t - now);
    }
    const bw = today.wins.length ? bestWindow(today.wins) : null;
    if (bw){
      bv.innerHTML = `${fishIcon(today.score, 18)} ${fmtRange12b(bw)} · ${today.score}`;
      bc.textContent = (now >= bw.start.getTime() && now <= bw.end.getTime())
        ? "Biting NOW · ends in " + fmtCountdown(bw.end.getTime() - now)
        : "in " + fmtCountdown(bw.start.getTime() - now);
    }
  }
  tick();
  tickTimer = setInterval(tick, 1000);
}
function fmtRange12b(w){ return fmtT12(w.start) + " – " + fmtT12(w.end); }

const COMPASS = ["N","NNE","NE","ENE","E","ESE","SE","SSE","S","SSW","SW","WSW","W","WNW","NW","NNW"];
const compass = d => COMPASS[Math.round(d / 22.5) % 16];

function renderStrip(sel){
  const days = window.__days;
  document.getElementById("strip").innerHTML = days.map((d, i) => {
    const dt = new Date(d.date + "T12:00:00");
    return `<div class="dpill${i === sel ? " sel" : ""}" data-i="${i}">` +
      `<div class="dn">${dt.getDate()}</div><div class="dw">${dt.toLocaleDateString("en-US", { weekday: "short" })}</div></div>`;
  }).join("");
  document.querySelectorAll(".dpill").forEach(el =>
    el.addEventListener("click", () => { renderStrip(+el.dataset.i); render(+el.dataset.i); }));
}

function render(i){
  const days = window.__days;
  const d = days[i];
  const app = document.getElementById("app");
  const best = d.wins.length ? bestWindow(d.wins) : null;
  const sky = d.sky;
  const C = 2 * Math.PI * 54;

  const majors = sky ? sky.majors.slice(0, 2) : [];
  const minors = sky ? sky.minors.slice(0, 2) : [];

  let html = `<div class="card">
    <div class="score-wrap">
      <div class="majmin"><div class="k">Major times</div>
        ${majors.map(mm => `<div class="t">${fmtRange12(mm.start, mm.end)}</div>`).join("") || `<div class="t">—</div>`}
      </div>
      <div class="dial">
        <svg width="128" height="128" viewBox="0 0 128 128">
          <circle cx="64" cy="64" r="54" fill="none" stroke="#e2e8f0" stroke-width="11"/>
          <circle cx="64" cy="64" r="54" fill="none" stroke="${fishColor(d.score)}" stroke-width="11"
            stroke-linecap="round" stroke-dasharray="${(d.score / 100 * C).toFixed(1)} ${C.toFixed(1)}"
            transform="rotate(-90 64 64)"/>
        </svg>
        <div class="num">${d.score}</div>
      </div>
      <div class="majmin" style="text-align:right"><div class="k">Minor times</div>
        ${minors.map(mm => `<div class="t">${fmtRange12(mm.start, mm.end)}</div>`).join("") || `<div class="t">—</div>`}
      </div>
    </div>
    <div class="activity">${activityLabel(d.score)}</div>`;

  if (i === 0){
    html += `<div class="counts">
      <div class="count"><div class="k">Next tide</div><div class="v" id="cd-tide-v">—</div><div class="c" id="cd-tide-c"></div></div>
      <div class="count"><div class="k">Next bite</div><div class="v" id="cd-bite-v">—</div><div class="c" id="cd-bite-c"></div></div>
    </div>`;
  }

  if (d.wins.length){
    html += `<div style="margin-top:10px"><div class="sec-t" style="font-size:12px">🐟 Best bite windows</div>`;
    d.wins.forEach(w => {
      const isBest = best && w.peak.getTime() === best.peak.getTime();
      const mtag = w.moonMajor ? " · 🌙" : "";
      html += `<div class="bite${isBest && i === 0 ? " next" : ""}">${fishIcon(d.score, 20)}` +
        `<span class="t">${fmtRange12(w.start, w.end)}</span>` +
        `<span class="tag">${w.type === "H" ? "high tide" : "low tide"}${mtag}${isBest ? " · BEST" : ""}</span></div>`;
    });
    html += `</div>`;
  }
  html += `</div>`;

  const bigT = d.curTemp !== null ? d.curTemp : d.tMax;
  const rain = d.curRain !== null ? d.curRain : d.rainMax;
  html += `<div class="card"><div class="sec-t">Weather<span class="r">Rain</span></div>
    <div class="wx">
      <div><div class="big">${bigT}°</div><div class="hl">${d.tMax}°F <span>${d.tMin}°F</span></div></div>
      <div class="wxgrid">
        <div><div class="lab">☂ ${rain}%</div></div><div><div class="lab">🧭 ${d.pres} hPa</div></div>
        <div><div class="lab">💧 ${d.hum}%</div></div><div><div class="lab">☀️ UV ${d.uvMax}</div></div>
        <div><div class="lab">🌊 ${d.waterTemp !== null ? d.waterTemp + "°F water" : "—"}</div></div>
        <div><div class="lab">💨 ${d.windMax} mph ${compass(d.windDir)}</div></div>
      </div>
    </div></div>`;

  let dayLen = "—";
  if (sky && sky.sunrise && sky.sunset){
    const ms = sky.sunset - sky.sunrise;
    dayLen = `${Math.floor(ms / 36e5)} h ${Math.round(ms % 36e5 / 6e4)} min`;
  }
  html += `<div class="smrow">
    <div class="card sunmoon"><div class="sec-t">Sun<span class="r">${dayLen}</span></div>
      <div class="row"><span class="k">Sunrise</span><span class="v">${sky && sky.sunrise ? fmtT12(sky.sunrise) : "—"}</span></div>
      <div class="row"><span class="k">Sunset</span><span class="v">${sky && sky.sunset ? fmtT12(sky.sunset) : "—"}</span></div>
    </div>
    <div class="card sunmoon"><div class="sec-t">Moon</div>
      <div class="moonbig"><span class="em">${sky ? moonEmoji(sky.phase) : "🌙"}</span>
        <span><div class="pn">${sky ? sky.phase : "—"}</div><div class="il">${sky ? sky.illum + " lit" : ""}</div></span></div>
      <div class="row"><span class="k">Moonrise</span><span class="v">${sky && sky.moonrise ? fmtT12(sky.moonrise) : "—"}</span></div>
      <div class="row"><span class="k">Moonset</span><span class="v">${sky && sky.moonset ? fmtT12(sky.moonset) : "—"}</span></div>
    </div>
  </div>`;

  let tideTop;
  if (i === 0){
    const cur = tideAt(d, Date.now());
    tideTop = cur
      ? `<div class="tidebig">${cur.v.toFixed(2)} ft <span class="tr">${cur.dir > 0 ? "↗" : cur.dir < 0 ? "↘" : "→"}</span></div>`
      : `<div class="tidebig">—</div>`;
  } else {
    const hs = d.tides.map(p => ({ v: parseFloat(p.v), t: new Date(p.t) }));
    const hi = hs.filter(p => d.tides.find(q => new Date(q.t).getTime() === p.t.getTime()).type === "H");
    const lo = hs.filter(p => d.tides.find(q => new Date(q.t).getTime() === p.t.getTime()).type === "L");
    const hMax = hi.length ? hi.reduce((a, b) => a.v > b.v ? a : b) : null;
    const lMin = lo.length ? lo.reduce((a, b) => a.v < b.v ? a : b) : null;
    tideTop = `<div style="font-size:15px;font-weight:800">` +
      (hMax ? `High ${hMax.v.toFixed(1)}ft ${fmtT12(hMax.t)}` : "") +
      (hMax && lMin ? " · " : "") +
      (lMin ? `Low ${lMin.v.toFixed(1)}ft ${fmtT12(lMin.t)}` : "") + `</div>`;
  }
  html += `<div class="card"><div class="sec-t">Tides</div>${tideTop}${tideSVG(d, best)}</div>`;

  app.innerHTML = html;
  document.getElementById("updated").textContent =
    "updated " + new Date().toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit", timeZone: TZ });
  startTicks();
}

load().catch(() => {
  document.getElementById("app").innerHTML = `<div class="err">Couldn't load forecast data. Check your connection and reopen.</div>`;
});
setInterval(load, 3600e3);
document.addEventListener("visibilitychange", () => { if (!document.hidden) load(); });
</script>
</body>
</html>
