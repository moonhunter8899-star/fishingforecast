/* ================= helpers ================= */
function $(id) { return document.getElementById(id); }
function pad(n) { return (n < 10 ? "0" : "") + n; }
function havKm(a, b, c, d) {
  var R = 6371, r1 = a * Math.PI / 180, r2 = c * Math.PI / 180;
  var h = Math.sin((c - a) * Math.PI / 360), k = Math.sin((d - b) * Math.PI / 360);
  var x = h * h + Math.cos(r1) * Math.cos(r2) * k * k;
  return 2 * R * Math.asin(Math.sqrt(x));
}
// distance (km) from point to FL east-coast shoreline polyline (equirectangular approx)
function distToShore(lat, lon) {
  var best = 1e9, kx = 111.32 * Math.cos(lat * Math.PI / 180), ky = 110.57;
  for (var i = 0; i < SHORE.length - 1; i++) {
    var ax = SHORE[i][1] * kx, ay = SHORE[i][0] * ky;
    var bx = SHORE[i+1][1] * kx, by = SHORE[i+1][0] * ky;
    var px = lon * kx, py = lat * ky;
    var dx = bx - ax, dy = by - ay;
    var t = ((px - ax) * dx + (py - ay) * dy) / (dx * dx + dy * dy);
    t = Math.max(0, Math.min(1, t));
    var ex = ax + t * dx - px, ey = ay + t * dy - py;
    var d = Math.sqrt(ex * ex + ey * ey);
    if (d < best) best = d;
  }
  return best;
}
function nearestStation(lat, lon) {
  var best = STATIONS[0], bd = 1e9;
  for (var i = 0; i < STATIONS.length; i++) {
    var d = havKm(lat, lon, STATIONS[i].lat, STATIONS[i].lon);
    if (d < bd) { bd = d; best = STATIONS[i]; }
  }
  return best.id;
}
function nearestTown(lat, lon) {
  var best = TOWNS[0][0], bd = 1e9;
  for (var i = 0; i < TOWNS.length; i++) {
    var d = havKm(lat, lon, TOWNS[i][1], TOWNS[i][2]);
    if (d < bd) { bd = d; best = TOWNS[i][0]; }
  }
  return best;
}

function loadTides(station, fromD, toD) {

  return fetchJSON(u).then(function(j) {

    (j.predictions || []).forEach(function(p) {
      // "2026-10-09 15:21" local station time

      if (!m) return;
      out.push({ t: new Date(+m[1], +m[2] - 1, +m[3], +m[4], +m[5]).getTime(), type: p.type, v: parseFloat(p.v) });
    });

function atHourly(hourly, isoIdx, key) { return hourly[key][isoIdx]; }
function hourlyIndex(hourly, ms) {
  // hourly.time entries "2026-10-09T14:00" local
  var best = 0, bd = 1e15;
  for (var i = 0; i < hourly.time.length; i++) {
    var t = new Date(hourly.time[i]).getTime();
    var d = Math.abs(t - ms);
    if (d < bd) { bd = d; best = i; }
  }
  return best;
}
function tideAt(ms) {

  if (!T.length) return 0;
  if (ms <= T[0].t) return T[0].v;
  for (var i = 0; i < T.length - 1; i++) {
    if (ms >= T[i].t && ms <= T[i + 1].t) {
      var f = (ms - T[i].t) / (T[i + 1].t - T[i].t);
      return T[i].v + f * (T[i + 1].v - T[i].v);

}

function biteScore(ms, wx, mar) {

  var wt = mar.hourly.water_temperature[mi];
  var temp = 15 * Math.max(0, 1 - Math.abs(wt - 70.5) / 18);
  var wsp = wx.hourly.windspeed_10m[wi];
  var wind = wsp <= 10 ? 15 : (wsp >= 25 ? 0 : 15 * (1 - (wsp - 10) / 15));

function buildDays(wx, mar) {
  var days = [];
  var now = new Date();
  for (var d = 0; d < 7; d++) {
    var date = new Date(now.getFullYear(), now.getMonth(), now.getDate() + d);
    var d0 = date.getTime(), d1 = d0 + 86400000;
    // find bite-window peaks, 30-min samples
    var peaks = [];
    var samples = [];
    for (var t2 = d0; t2 < d1; t2 += 1800000) samples.push({ t: t2, s: biteScore(t2, wx, mar) });
    for (var i = 1; i < samples.length - 1; i++) {
      if (samples[i].s >= samples[i-1].s && samples[i].s >= samples[i+1].s && samples[i].s >= 40) {
        var ok = true;
        for (var k = 0; k < peaks.length; k++) {
          if (Math.abs(peaks[k].t - samples[i].t) < 7200000) {
            ok = false;
            if (samples[i].s > peaks[k].s) peaks[k] = { t: samples[i].t, s: samples[i].s };
          }
        }
        if (ok) peaks.push({ t: samples[i].t, s: samples[i].s });
      }
    }
    peaks.sort(function(a, b) { return b.s - a.s; });
    peaks = peaks.slice(0, 4);
    var windows = peaks.map(function(p) {
      return { start: new Date(p.t - 3600000), end: new Date(p.t + 3600000), score: Math.round(p.s) };
    });
    windows.sort(function(a, b) { return a.start - b.start; });
    var best = windows[0];
    windows.forEach(function(w) { if (w.score > best.score) best = w; });
    var dayScore = 0;
    if (windows.length) {
      var avg = windows.reduce(function(a, w) { return a + w.score; }, 0) / windows.length;
      dayScore = Math.round(0.65 * best.score + 0.35 * avg);
    }
    // weather tiles at best-window peak (or noon)
    var refT = best ? best.start.getTime() + 3600000 : d0 + 43200000;
    var wi = hourlyIndex(wx.hourly, refT), mi = hourlyIndex(mar.hourly, refT);
    var wv = mar.hourly.wave_height[mi] * 3.28084;
    days.push({
      date: date, score: dayScore, windows: windows, best: best,
      wind: Math.round(wx.hourly.windspeed_10m[wi]),
      windDir: compass(wx.hourly.winddirection_10m[wi]),
      water: wx && mar ? (Math.round(mar.hourly.water_temperature[mi] * 10) / 10) : 0,
      waveFt: Math.round(wv * 10) / 10,

  };
  renderHeader();
  var fromD = new Date(); fromD.setDate(fromD.getDate() - 1);
  var toD = new Date(); toD.setDate(toD.getDate() + 7);
  var moonPs = [];
  for (var i = 0; i < 8; i++) {
    var dt = new Date(); dt.setDate(dt.getDate() + i);
    moonPs.push(loadMoonDay(lat, lon, dt));
  }
  var placeP = mode === "live" ? loadPlaceName(lat, lon) : Promise.resolve(PIN.name);
  Promise.all([loadWeather(lat, lon), loadMarine(lat, lon), loadTides(station, fromD, toD),
      Promise.all(moonPs), placeP])
    .then(function(r) {
      var wx = r[0], mar = r[1];
      state.wx = wx; state.mar = mar;
      state.tides = r[2];
      var all = [];
      r[3].forEach(function(arr) { arr.forEach(function(w) { all.push(w); }); });
      state.moon = dedupeMoon(all);
      state.loc.name = r[4];
      state.days = buildDays(wx, mar);
      state.sel = 0;
      state.ready = true; state.loading = false;
      state.updatedAt = new Date();
      renderAll();
    })
    .catch(function() { state.loading = false; showError(); });
}
function onGeo(pos) {
  var lat = pos.coords.latitude, lon = pos.coords.longitude;
  if (distToShore(lat, lon) <= SHORE_KM) {
    startLoad(lat, lon, "live", null);
  } else {
    var mi = Math.round(havKm(lat, lon, PIN.lat, PIN.lon) * 0.621371);
    startLoad(PIN.lat, PIN.lon, "pin", mi);
  }
}
function onGeoFail() {
  startLoad(PIN.lat, PIN.lon, "pin", null);
}
function boot(force) {
  state.ready = false; state.sel = 0; state.days = [];
  var S = STR[state.lang];
  document.documentElement.lang = state.lang;
  $("app").innerHTML = '<div class="loading">' + S.loading + "</div>";
  renderHeader();
  if (force) { onGeoFail(); return; }
  var got = false;
  function once(fn) { return function(a) { if (!got) { got = true; fn(a); } }; }
  if (navigator.geolocation) {
    try {
      navigator.geolocation.getCurrentPosition(once(onGeo), once(onGeoFail),
        { timeout: 9000, maximumAge: 600000 });
    } catch (e) { onGeoFail(); got = true; }
  }
  setTimeout(function() { if (!got) { got = true; onGeoFail(); } }, 10000);
}
$("langBtn").addEventListener("click", function() {
  state.lang = state.lang === "en" ? "vi" : "en";
  localStorage.setItem("pf_lang", state.lang);
  document.documentElement.lang = state.lang;
  if (state.ready) renderAll(); else boot();
});
$("refBtn").addEventListener("click", function() { boot(true); });
$("locBtn").addEventListener("click", function() {
  if (navigator.geolocation) {
    try { navigator.geolocation.getCurrentPosition(onGeo, onGeoFail, { timeout: 9000 }); }
    catch (e) { onGeoFail(); }
  } else onGeoFail();
});
boot();
setInterval(tick, 1000);
</script>
</body>
