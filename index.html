<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#f6f0df">
<title>Pompano Forecast — Tien Huynh</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700;9..144,800;9..144,900&family=Public+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }
  body {
    background: #f6f0df; color: #2b2620;
    font-family: "Public Sans", -apple-system, "Segoe UI", sans-serif;
    font-variant-numeric: tabular-nums;
  }
  .wrap { max-width: 576px; margin: 0 auto; padding: 12px 12px 40px; }
  h1, h2, h3, .serif { font-family: "Fraunces", Georgia, serif; }

  /* Header */
  .hd { display: flex; align-items: flex-start; justify-content: space-between; margin: 4px 2px 12px; }
  .hd .t1 { font-family: "Fraunces", serif; font-weight: 800; font-size: 15px; }
  .hd .t1 .nm { color: #8a7a5f; font-weight: 600; font-size: 12px; }
  .hd .t2 { color: #8a7a5f; font-size: 10px; margin-top: 2px; }
  .refresh {
    background: #bc5a1e; color: #fff; border: none; border-radius: 999px;
    font-family: "Fraunces", serif; font-weight: 800; font-size: 13px;
    padding: 8px 16px; cursor: pointer; flex: none;
  }

  /* Top rating card */
  .topcard {
    position: relative; overflow: hidden;
    background: #22312b; border-radius: 22px; padding: 18px;
    border: 2px solid #1d9e6c;
    box-shadow: 0 4px 14px rgba(34,49,43,.25);
    margin-bottom: 14px; color: #fff;
  }
  .topcard .wm { position: absolute; top: -8px; right: 6px; opacity: .14; pointer-events: none; }
  .topcard .row { display: flex; align-items: center; gap: 14px; position: relative; }
  .badge {
    width: 58px; height: 58px; border-radius: 50%; background: #fff; flex: none;
    display: flex; align-items: center; justify-content: center;
  }
  .topcard .lbl { color: #e8c76a; font-size: 10px; font-weight: 700; letter-spacing: .18em; }
  .topcard .big { font-family: "Fraunces", serif; font-weight: 900; font-size: 30px; color: #fff; margin-top: 2px; }
  .topcard .big .sc { font-size: 22px; }
  .topcard .side { margin-left: auto; text-align: right; color: #e8c76a; font-size: 10px; font-weight: 700; letter-spacing: .12em; line-height: 1.7; }

  /* Day strip */
  .pick { display: flex; align-items: baseline; justify-content: space-between; margin: 2px 2px 8px; }
  .pick .ph { font-family: "Fraunces", serif; font-weight: 800; font-size: 13px; color: #9a4a16; }
  .pick .pr { font-size: 11px; color: #8a7a5f; }
  .strip { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin-bottom: 10px; }
  .dpill {
    background: #fffaf0; border: 1px solid #e3d5b3; border-radius: 12px; padding: 8px 2px 7px;
    text-align: center; cursor: pointer; position: relative; font-family: "Public Sans", sans-serif;
    color: #2b2620;
  }
  .dpill .dw { font-size: 10px; color: #8a7a5f; font-weight: 600; text-transform: uppercase; }
  .dpill .dn { font-family: "Fraunces", serif; font-size: 18px; font-weight: 800; }
  .dpill .dsc { font-size: 12px; font-weight: 800; }
  .dpill .dow2 { font-size: 8px; color: #8a7a5f; white-space: nowrap; letter-spacing: 0; }
  .dpill.sel { color: #fff; border-color: transparent; }
  .dpill.sel .dw, .dpill.sel .dow2 { color: rgba(255,255,255,.85); }
  .dpill.best { background: #fff3cf; border: 2px solid #d9a441; box-shadow: 0 0 8px rgba(217,164,65,.5); }
  .dpill .bestbadge {
    position: absolute; top: -9px; left: 50%; transform: translateX(-50%);
    background: #6b4a1f; color: #ffe9a8; font-size: 8px; font-weight: 800;
    padding: 2px 6px; border-radius: 999px; letter-spacing: .06em; white-space: nowrap;
  }
  .bestbanner {
    display: flex; align-items: center; gap: 10px;
    background: #fff3cf; border-radius: 12px; padding: 9px 12px; margin-bottom: 14px;
    font-size: 12px; font-weight: 600; color: #6b4a1f;
  }
  .bestbanner .star {
    width: 26px; height: 26px; border-radius: 50%; background: #d9a441; color: #fff;
    display: flex; align-items: center; justify-content: center; font-size: 14px; flex: none;
  }
  .bestbanner .go {
    margin-left: auto; background: #6b4a1f; color: #ffe9a8; border: none; border-radius: 999px;
    font-size: 10px; font-weight: 800; padding: 6px 12px; cursor: pointer; letter-spacing: .06em; flex: none;
  }

  /* Day summary card */
  .card {
    background: #fffaf0; border-radius: 20px; padding: 16px; margin-bottom: 14px;
    border: 1.5px solid #1d9e6c;
  }
  .card h3 { margin: 0; font-size: 20px; font-weight: 900; }
  .card h3 .dt { font-family: "Public Sans", sans-serif; font-size: 13px; font-weight: 600; color: #8a7a5f; }
  .sub2 { font-size: 12px; color: #8a7a5f; margin: 2px 0 10px; }
  .ratingpill {
    display: inline-flex; align-items: center; gap: 8px; border-radius: 999px;
    padding: 7px 14px 7px 8px; color: #fff; font-weight: 800; font-size: 14px; margin-bottom: 12px;
  }
  .ratingpill .wc {
    width: 30px; height: 30px; border-radius: 50%; background: #fff;
    display: flex; align-items: center; justify-content: center; flex: none;
  }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
  .chip {
    display: inline-flex; align-items: center; gap: 6px; border-radius: 999px;
    padding: 7px 12px; font-size: 12px; font-weight: 700;
    background: #fffaf0; border: 1px solid #d9c9a3; color: #2b2620;
  }
  .chip.best { background: #bc5a1e; border-color: #bc5a1e; color: #fff; }

  .wxgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 14px; }
  .wxbox { background: #ede4cc; border-radius: 12px; padding: 12px; }
  .wxbox.sky { border: 1.5px solid #c9b78f; }
  .wxbox .k { font-size: 10px; font-weight: 700; letter-spacing: .08em; color: #8a7a5f; text-transform: uppercase; }
  .wxbox .v { font-family: "Fraunces", serif; font-size: 21px; font-weight: 800; margin-top: 2px; }
  .wxbox .s { font-size: 11px; color: #6b5f4c; margin-top: 2px; }

  .mmhead {
    display: flex; align-items: center; justify-content: space-between; margin: 2px 0 6px;
  }
  .mmhead .t { font-size: 12px; font-weight: 800; letter-spacing: .1em; color: #9a4a16; text-transform: uppercase; }
  .mmhead .n { font-size: 10px; font-weight: 700; background: #ede4cc; border-radius: 999px; padding: 3px 10px; color: #6b5f4c; }
  .mmrow {
    display: flex; align-items: center; gap: 10px; padding: 8px 10px;
    border-top: 1px solid #eee2c8; font-size: 13px;
  }
  .mmrow.next { background: #fff3cf; border: 1.5px solid #d9a441; border-radius: 10px; margin: 4px 0; }
  .mmbadge { font-size: 10px; font-weight: 800; letter-spacing: .06em; padding: 4px 9px; border-radius: 6px; color: #fff; flex: none; }
  .mmbadge.major { background: #bc5a1e; }
  .mmbadge.minor { background: #9a958a; }
  .mmrow .tt { font-weight: 700; }
  .mmrow .mc { color: #8a7a5f; font-size: 11px; margin-left: auto; }
  .mmrow .nextpill {
    background: #6b4a1f; color: #ffe9a8; font-size: 9px; font-weight: 800;
    padding: 3px 8px; border-radius: 999px; letter-spacing: .06em; flex: none;
  }
  .footnote { font-size: 11px; color: #8a7a5f; margin-top: 12px; line-height: 1.7; }

  /* Hourly */
  .hcard { background: #fffaf0; border-radius: 20px; padding: 16px; margin-bottom: 14px; border: 1.5px solid #e3d5b3; }
  .hcard h3 { margin: 0 0 4px; font-size: 18px; }
  .legend { display: flex; gap: 14px; font-size: 11px; font-weight: 700; color: #6b5f4c; margin-bottom: 8px; align-items: center; }
  .htable { width: 100%; border-collapse: collapse; font-size: 12px; }
  .htable th { text-align: left; font-size: 10px; text-transform: uppercase; letter-spacing: .06em; color: #8a7a5f; padding: 6px 4px; border-bottom: 1px solid #e3d5b3; }
  .htable td { padding: 7px 4px; border-bottom: 1px solid #f0e7d2; }
  .htable tr.biterow td { background: #e4f4e8; }
  .htable tr:first-child td { border-top: none; }
  .hfoot { font-size: 10px; color: #8a7a5f; margin-top: 8px; line-height: 1.6; }

  /* Tide */
  .tidecard { background: #fffaf0; border-radius: 20px; padding: 16px; margin-bottom: 14px; border: 1.5px solid #e3d5b3; }
  .tidecard h3 { margin: 0; font-size: 18px; }
  .tidesub { font-size: 12px; color: #8a7a5f; margin: 2px 0 6px; }
  .tide-svg { width: 100%; height: 104px; display: block; }
  .tidechips { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  .tchip {
    display: inline-flex; align-items: center; gap: 6px; border-radius: 999px;
    padding: 7px 12px; font-size: 12px; font-weight: 700;
  }
  .tchip.hi { background: #bc5a1e; color: #fff; }
  .tchip.lo { background: #ede4cc; color: #6b5f4c; }

  .loading { text-align: center; color: #8a7a5f; padding: 60px 0; font-size: 14px; }
  .err { color: #c93a2e; text-align: center; padding: 40px 0; }
</style>
</head>
<body>
<div class="wrap">
  <div class="hd">
    <div>
      <div class="t1">Jupiter Inlet, FL — Pompano <span class="nm">· Tien Huynh</span></div>
      <div class="t2" id="hdsub">26.9166°, −80.0642°</div>
    </div>
    <button class="refresh" id="refreshBtn">Refresh</button>
  </div>
  <div id="app"><div class="loading">Checking pompano conditions…</div></div>
</div>
<script>
const HOME = { lat: 26.9166, lon: -80.0642, station: "8722495", name: "Jupiter Inlet, FL", short: "JUPITER INLET" };
const TZ = "America/New_York";
let LOC = { ...HOME, live: false };

function hav(a,b,c,d){
  const R = 3958.8, r = Math.PI/180;
  const x = (c-a)*r, y = (d-b)*r;
  const h = Math.sin(x/2)**2 + Math.cos(a*r)*Math.cos(c*r)*Math.sin(y/2)**2;
  return 2*R*Math.asin(Math.sqrt(h));
}
function getPos(){
  return new Promise(res => {
    if (!navigator.geolocation) return res(null);
    navigator.geolocation.getCurrentPosition(
      p => res({ lat: p.coords.latitude, lon: p.coords.longitude }),
      () => res(null),
      { timeout: 8000, maximumAge: 600000 }
    );
  });
}
async function revName(lat, lon){
  try{
    const r = await fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${lat}&longitude=${lon}&localityLanguage=en`);
    const j = await r.json();
    const city = j.city || j.locality || "";
    const st = j.principalSubdivisionCode ? j.principalSubdivisionCode.split("-").pop() : "";
    return city ? (st ? `${city}, ${st}` : city) : null;
  }catch(e){ return null; }
}
async function nearestStation(lat, lon){
  try{
    const r = await fetch("https://api.tidesandcurrents.noaa.gov/mdapi/prod/webapi/stations.json");
    const j = await r.json();
    let best = null, bd = 1e9;
    for (const s of j.stations || []){
      if (!s.tidal) continue;
      const d = hav(lat, lon, parseFloat(s.lat), parseFloat(s.lng));
      if (d < bd){ bd = d; best = s; }
    }
    return best ? { id: best.id, name: best.name } : null;
  }catch(e){ return null; }
}
async function detectLocation(){
  const pos = await getPos();
  if (!pos) return;
  if (hav(pos.lat, pos.lon, HOME.lat, HOME.lon) < 10) return;
  const [nm, st] = await Promise.all([revName(pos.lat, pos.lon), nearestStation(pos.lat, pos.lon)]);
  LOC = {
    lat: pos.lat, lon: pos.lon,
    station: st ? st.id : HOME.station,
    name: nm || (st ? st.name : null) || `${pos.lat.toFixed(2)}°, ${pos.lon.toFixed(2)}°`,
    short: (nm || "CURRENT SPOT").toUpperCase(),
    live: true
  };
}

/* Pompano icon: deep compressed body, blunt steep head, deeply forked tail */
function pompano(color, size){
  size = size || 24;
  return `<svg width="${size}" height="${size}" viewBox="0 0 48 48" style="flex:none;display:block">` +
    `<path d="M4 24C8 14 16 8 26 8L34 12L44 6L40 16L44 26L34 21C28 27 18 32 10 30C6 29 4 27 4 24Z" fill="${color}"/>` +
    `<path d="M15 23C18 21 21 21 23.5 23" stroke="#fff" stroke-width="1.8" fill="none" opacity=".9"/>` +
    `<circle cx="11" cy="20" r="2.7" fill="#fff"/><circle cx="11" cy="20" r="1.3" fill="#22312b"/></svg>`;
}
function rateColor(s){ return s >= 60 ? "#1d9e6c" : s >= 40 ? "#d98a16" : "#c93a2e"; }
function outlook(s){
  return s >= 90 ? "Outstanding" : s >= 80 ? "Great" : s >= 65 ? "Good" : s >= 40 ? "Fair" : "Poor";
}
const p2 = n => String(n).padStart(2, "0");
const fmtT12 = d => {
  let h = d.getHours(); const ap = h >= 12 ? "PM" : "AM"; h = h % 12 || 12;
  return h + ":" + p2(d.getMinutes()) + " " + ap;
};
const fmtRange = (a, b) => fmtT12(a).replace(" ", "") + "–" + fmtT12(b).replace(" ", "");
const dayKey = iso => iso.slice(0, 10);
const COMPASS = ["N","NNE","NE","ENE","E","ESE","SE","SSE","S","SSW","SW","WSW","W","WNW","NW","NNW"];
const compass = d => COMPASS[Math.round(d / 22.5) % 16];
const arrow = d => `<span style="display:inline-block;transform:rotate(${d + 180}deg)">➤</span>`;

function wxInfo(code){
  if (code === 0) return { t: "Sunny", e: "☀️" };
  if (code === 1) return { t: "Mostly sunny", e: "🌤️" };
  if (code === 2) return { t: "Partly cloudy", e: "⛅" };
  if (code === 3) return { t: "Cloudy", e: "☁️" };
  if (code <= 48) return { t: "Foggy", e: "🌫️" };
  if (code <= 67) return { t: "Rainy", e: "🌧️" };
  if (code <= 77) return { t: "Snowy", e: "🌨️" };
  if (code <= 82) return { t: "Showers", e: "🌦️" };
  return { t: "Stormy", e: "⛈️" };
}

/* Pompano-tuned scoring: moving water, 65–76°F, 1–3 ft surf */
function fishScore(d){
  let s = 0;
  s += d.windMax <= 10 ? 30 : d.windMax <= 15 ? 22 : d.windMax <= 20 ? 12 : 4;
  s += d.rainMax < 20 ? 20 : d.rainMax < 40 ? 14 : d.rainMax < 60 ? 8 : 3;
  s += (d.waterTemp >= 65 && d.waterTemp <= 76) ? 25 : (d.waterTemp >= 60 && d.waterTemp <= 80) ? 18 : 10;
  s += (d.waveMax >= 1 && d.waveMax <= 3) ? 18 : d.waveMax < 1 ? 12 : d.waveMax <= 5 ? 8 : 4;
  s += d.tideRange >= 2.5 ? 20 : d.tideRange >= 1.5 ? 14 : 8;
  return Math.min(100, Math.round(s));
}
function hourScore(h, inBite, moonBoost){
  let s = 45;
  s += (h.temp >= 70 && h.temp <= 80) ? 15 : (h.temp >= 65 && h.temp <= 85) ? 8 : -5;
  s += h.wind <= 10 ? 10 : h.wind <= 15 ? 4 : -10;
  s += h.rain < 20 ? 10 : h.rain < 50 ? 0 : -12;
  if (inBite) s += 18;
  if (moonBoost) s += 8;
  return Math.max(0, Math.min(100, Math.round(s)));
}
function biteWindows(tides){
  return tides.map(p => {
    const c = new Date(p.t).getTime(), w = 90 * 60 * 1000;
    return { start: new Date(c - w), end: new Date(c + w), peak: new Date(p.t), type: p.type };
  });
}
const overlaps = (a, b) => a.start.getTime() < b.end.getTime() && b.start.getTime() < a.end.getTime();
function bestWindow(wins){
  const now = Date.now();
  const up = wins.filter(w => w.end.getTime() > now);
  if (!up.length) return wins[0];
  const bm = up.filter(w => w.moonMajor);
  return bm.length ? bm[0] : up[0];
}

async function skyInfo(dateStr){
  try{
    const tzH = -new Date(dateStr + "T12:00:00").getTimezoneOffset() / 60;
    const r = await fetch(`https://aa.usno.navy.mil/api/rstt/oneday?date=${dateStr}&coords=${LOC.lat},${LOC.lon}&tz=${tzH}`);
    const j = await r.json();
    const data = j.properties.data;
    const toD = hm => {
      const [h, m] = hm.split(":").map(Number);
      const d = new Date(dateStr + "T12:00:00"); d.setHours(h, m, 0, 0); return d;
    };
    const getPhen = (arr, phen) => (((arr || []).find(x => x.phen === phen) || {}).time);
    const H = 36e5, majors = [], minors = [];
    const upper = getPhen(data.moondata, "Upper Transit");
    if (upper){
      const u = toD(upper);
      majors.push({ start: new Date(u.getTime() - 2 * H), end: new Date(u.getTime() + 2 * H), label: "Moon overhead" });
    }
    const mr = getPhen(data.moondata, "Rise"), ms = getPhen(data.moondata, "Set");
    if (mr){ const t = toD(mr); minors.push({ start: new Date(t.getTime() - H), end: new Date(t.getTime() + H), label: "Moonrise" }); }
    if (ms){ const t = toD(ms); minors.push({ start: new Date(t.getTime() - H), end: new Date(t.getTime() + H), label: "Moonset" }); }
    const sr = getPhen(data.sundata, "Rise"), ss = getPhen(data.sundata, "Set");
    return {
      phase: data.curphase, illum: data.fracillum, majors, minors,
      sunrise: sr ? toD(sr) : null, sunset: ss ? toD(ss) : null,
      moonrise: mr ? toD(mr) : null, moonset: ms ? toD(ms) : null
    };
  }catch(e){ return null; }
}

async function load(){
  await detectLocation();
  const fUrl = `https://api.open-meteo.com/v1/forecast?latitude=${LOC.lat}&longitude=${LOC.lon}` +
    `&hourly=temperature_2m,precipitation_probability,wind_speed_10m,wind_direction_10m,windgusts_10m,weathercode` +
    `&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max,wind_speed_10m_max,wind_direction_10m_dominant,weathercode` +
    `&timezone=${encodeURIComponent(TZ)}&wind_speed_unit=mph&temperature_unit=fahrenheit&forecast_days=7`;
  const mUrl = `https://marine-api.open-meteo.com/v1/marine?latitude=${LOC.lat}&longitude=${LOC.lon}` +
    `&hourly=sea_surface_temperature,wave_height&timezone=${encodeURIComponent(TZ)}` +
    `&temperature_unit=fahrenheit&forecast_days=7`;
  const now = new Date();
  const bd = now.toISOString().slice(0, 10).replace(/-/g, "");
  const ed = new Date(now.getTime() + 7 * 864e5).toISOString().slice(0, 10).replace(/-/g, "");
  const tUrl = `https://api.tidesandcurrents.noaa.gov/api/prod/datagetter?product=predictions&datum=MLLW` +
    `&station=${LOC.station}&time_zone=lst_ldt&units=english&interval=hilo&format=json&begin_date=${bd}&end_date=${ed}`;

  const [f, m, t] = await Promise.all([
    fetch(fUrl).then(r => r.json()),
    fetch(mUrl).then(r => r.json()),
    fetch(tUrl).then(r => r.json()).catch(() => ({ predictions: [] }))
  ]);

  const days = f.daily.time.map((date, i) => {
    const hrs = f.hourly.time.map((t2, j) => j).filter(j => dayKey(f.hourly.time[j]) === date);
    let waveMax = 0, waterNoon = null;
    const mh = m.hourly.time.map((t2, j) => j).filter(j => dayKey(m.hourly.time[j]) === date);
    mh.forEach(j => {
      const wv = (m.hourly.wave_height[j] || 0) * 3.28084;
      if (wv > waveMax) waveMax = wv;
      if (Math.abs(new Date(m.hourly.time[j]).getHours() - 12) < 2 && waterNoon === null)
        waterNoon = m.hourly.sea_surface_temperature[j];
    });
    const at = j => ({
      temp: Math.round(f.hourly.temperature_2m[j]),
      rain: f.hourly.precipitation_probability[j] ?? 0,
      wind: Math.round(f.hourly.wind_speed_10m[j]),
      gust: Math.round(f.hourly.windgusts_10m[j] ?? 0),
      wdir: f.hourly.wind_direction_10m[j],
      code: f.hourly.weathercode[j],
      time: new Date(f.hourly.time[j])
    });
    const tides = (t.predictions || []).filter(p => dayKey(p.t) === date);
    const hs = tides.map(p => parseFloat(p.v));
    const wins = biteWindows(tides);
    const d = {
      date, i, hrs: hrs.map(at), tides, wins,
      tMax: Math.round(f.daily.temperature_2m_max[i]),
      tMin: Math.round(f.daily.temperature_2m_min[i]),
      rainMax: f.daily.precipitation_probability_max[i] ?? 0,
      windMax: Math.round(f.daily.wind_speed_10m_max[i] ?? 0),
      windDir: f.daily.wind_direction_10m_dominant[i] ?? 0,
      wxCode: f.daily.weathercode[i],
      waterTemp: waterNoon !== null ? Math.round(waterNoon) : null,
      waveMax: Math.round(waveMax * 10) / 10,
      tideRange: hs.length ? Math.round((Math.max(...hs) - Math.min(...hs)) * 10) / 10 : 0
    };
    d.score = fishScore(d);
    return d;
  });

  const skies = await Promise.all(days.map(d => skyInfo(d.date)));
  days.forEach(d => {
    d.sky = skies[d.i];
    d.wins.forEach(w => {
      w.moonMajor = d.sky ? d.sky.majors.some(mm => overlaps(w, mm)) : false;
    });
    if (d.wins.some(w => w.moonMajor)) d.score = Math.min(100, d.score + 10);
    d.hrs.forEach(h => {
      const t = h.time.getTime();
      const inBite = d.wins.some(w => t >= w.start.getTime() && t <= w.end.getTime());
      const moonB = d.sky ? d.sky.majors.some(mm => t >= mm.start.getTime() && t <= mm.end.getTime()) : false;
      h.score = hourScore(h, inBite, moonB);
      h.inBite = inBite;
    });
  });

  window.__days = days;
  const bi = days.reduce((a, d, i) => d.score > days[a].score ? i : a, 0);
  window.__best = bi;
  document.querySelector(".hd .t1").innerHTML =
    `${LOC.live ? "📍 " : ""}${LOC.name} — Pompano <span class="nm">· Tien Huynh</span>`;
  render(0);
  document.getElementById("hdsub").textContent =
    `${LOC.lat.toFixed(4)}°, ${LOC.lon.toFixed(4)}° · Updated ` +
    new Date().toLocaleString("en-US", { month: "short", day: "numeric", hour: "numeric", minute: "2-digit", timeZone: TZ }) + " ET";
}

function tideAt(day, timeMs){
  const pts = day.tides.map(p => ({ t: new Date(p.t).getTime(), v: parseFloat(p.v) }));
  if (!pts.length) return null;
  if (timeMs <= pts[0].t) return { v: pts[0].v, dir: 0 };
  for (let k = 0; k < pts.length - 1; k++){
    const a = pts[k], b = pts[k + 1];
    if (timeMs >= a.t && timeMs <= b.t){
      const fr = (timeMs - a.t) / ((b.t - a.t) || 1);
      const v = a.v + (b.v - a.v) * (0.5 - 0.5 * Math.cos(Math.PI * fr));
      return { v, dir: b.v > a.v ? 1 : b.v < a.v ? -1 : 0 };
    }
  }
  return { v: pts[pts.length - 1].v, dir: 0 };
}

function tideSVG(day, highlight){
  const pts = day.tides.map(p => ({ t: new Date(p.t), v: parseFloat(p.v), type: p.type }));
  if (pts.length < 2) return `<div style="font-size:12px;color:#8a7a5f">Tide data unavailable.</div>`;
  const W = 340, H = 104, P = 10;
  const vs = pts.map(p => p.v), vMin = Math.min(...vs), vMax = Math.max(...vs), vR = (vMax - vMin) || 1;
  const t0 = pts[0].t.getTime(), t1 = pts[pts.length - 1].t.getTime(), tR = (t1 - t0) || 1;
  const X = t => P + (t - t0) / tR * (W - 2 * P);
  const Y = v => H - P - (v - vMin) / vR * (H - 2 * P);
  let dAttr = "";
  for (let k = 0; k <= 110; k++){
    const tt = t0 + tR * k / 110;
    let seg = 0;
    while (seg < pts.length - 2 && pts[seg + 1].t.getTime() < tt) seg++;
    const a = pts[seg], b = pts[seg + 1];
    const fr = Math.min(1, Math.max(0, (tt - a.t.getTime()) / ((b.t.getTime() - a.t.getTime()) || 1)));
    const v = a.v + (b.v - a.v) * (0.5 - 0.5 * Math.cos(Math.PI * fr));
    dAttr += (k ? "L" : "M") + X(tt).toFixed(1) + "," + Y(v).toFixed(1);
  }
  let shades = "";
  day.wins.forEach(w => {
    const x1 = X(Math.max(t0, w.start.getTime())), x2 = X(Math.min(t1, w.end.getTime()));
    if (x2 <= x1) return;
    shades += `<rect x="${x1.toFixed(1)}" y="${P}" width="${(x2 - x1).toFixed(1)}" height="${H - 2 * P}" fill="#14705f" opacity="0.18" rx="4"/>`;
  });
  let marks = "";
  pts.forEach(p => {
    const x = X(p.t.getTime()), y = Y(p.v);
    marks += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="4" fill="#fff" stroke="#14705f" stroke-width="2.5"/>` +
      `<text x="${x.toFixed(1)}" y="${(y - 9).toFixed(1)}" fill="#5c5546" font-size="9" text-anchor="middle" font-weight="700">${p.type === "H" ? "▲" : "▼"} ${fmtT12(p.t).replace(" ", "")}</text>`;
  });
  let fish = "";
  if (highlight){
    const hx = X(highlight.peak.getTime());
    fish = `<g transform="translate(${hx.toFixed(1)},${P + 12})">` +
      `<circle r="11" fill="#fff" stroke="#14705f" stroke-width="2"/>` +
      `<g transform="translate(-8,-8) scale(0.34)">${pompano("#14705f", 48).replace(/width="48" height="48" /, "")}</g>` +
      `<text y="26" text-anchor="middle" font-size="9" font-weight="800" fill="#14705f">${fmtT12(highlight.peak).replace(" ", "")}</text></g>`;
  }
  const nowX = X(Date.now());
  const nowLine = (nowX > P && nowX < W - P)
    ? `<line x1="${nowX.toFixed(1)}" y1="${P}" x2="${nowX.toFixed(1)}" y2="${H - P}" stroke="#d9a441" stroke-width="1.5" stroke-dasharray="4,3"/>` : "";
  const ax = `<text x="${P}" y="${H - 1}" font-size="8" fill="#8a7a5f">12a</text>` +
    `<text x="${W - P}" y="${H - 1}" font-size="8" fill="#8a7a5f" text-anchor="end">12p</text>`;
  return `<svg class="tide-svg" viewBox="0 0 ${W} ${H}">${shades}` +
    `<path d="${dAttr}" fill="none" stroke="#14705f" stroke-width="2.5"/>${marks}${fish}${nowLine}${ax}</svg>`;
}

function render(sel){
  const days = window.__days, bi = window.__best;
  const d = days[sel], sky = d.sky, bd = days[bi];
  const app = document.getElementById("app");
  const rc = rateColor(d.score), word = outlook(d.score);
  const best = d.wins.length ? bestWindow(d.wins) : null;
  const nowMs = Date.now();

  /* next major/minor */
  const allSol = [
    ...(sky ? sky.majors.map(mm => ({ ...mm, kind: "MAJOR" })) : []),
    ...(sky ? sky.minors.map(mm => ({ ...mm, kind: "MINOR" })) : [])
  ].sort((a, b) => a.start - b.start);
  const nextSol = allSol.find(mm => mm.end.getTime() > nowMs) || null;

  /* best hour */
  const bh = d.hrs.reduce((a, h) => h.score > a.score ? h : a, d.hrs[0] || { score: 0 });

  /* top card */
  const dt = new Date(d.date + "T12:00:00");
  const dayName = sel === 0 ? "TODAY" : dt.toLocaleDateString("en-US", { weekday: "long" }).toUpperCase();
  let html = `<div class="topcard" style="border-color:${rc}">` +
    `<div class="wm">${pompano("#ffffff", 72)}</div>` +
    `<div class="row"><div class="badge">${pompano(rc, 40)}</div>` +
    `<div><div class="lbl">POMPANO BITE RATING</div>` +
    `<div class="big">${word.toUpperCase()} <span class="sc" style="color:${rc}">${d.score}/100</span></div></div>` +
    `<div class="side">${dayName}<br>${LOC.short}</div></div></div>`;

  /* day strip */
  const d0 = new Date(days[0].date + "T12:00:00"), d6 = new Date(days[6].date + "T12:00:00");
  const rng = d0.toLocaleDateString("en-US", { month: "short", day: "numeric" }) + " – " +
    d6.toLocaleDateString("en-US", { month: "short", day: "numeric" });
  html += `<div class="pick"><div class="ph">Pick a day</div><div class="pr">${rng}</div></div><div class="strip">` +
    days.map((dd, i) => {
      const t = new Date(dd.date + "T12:00:00"), c = rateColor(dd.score);
      const cls = "dpill" + (i === sel ? " sel" : "") + (i === bi ? " best" : "");
      const st = i === sel ? `background:${c};` : "";
      return `<button class="${cls}" data-i="${i}" style="${st}">` +
        (i === bi ? `<span class="bestbadge">★ BEST</span>` : "") +
        `<div class="dw">${i === 0 ? "Today" : t.toLocaleDateString("en-US", { weekday: "short" })}</div>` +
        `<div class="dn">${t.getDate()}</div>` +
        `<div style="display:flex;justify-content:center;margin:2px 0">${pompano(i === sel ? "#ffffff" : c, 20)}</div>` +
        `<div class="dsc" style="color:${i === sel ? "#fff" : c}">${dd.score}</div>` +
        `<div class="dow2">${outlook(dd.score)}</div></button>`;
    }).join("") + `</div>`;

  /* best day banner */
  const bdt = new Date(bd.date + "T12:00:00");
  html += `<div class="bestbanner"><span class="star">★</span>` +
    `<span>BEST DAY THIS WEEK — ${bdt.toLocaleDateString("en-US", { weekday: "short" })} ${bdt.getDate()} · ${bdt.toLocaleDateString("en-US", { month: "short" })} ${bdt.getDate()} — ${outlook(bd.score)} (${bd.score})</span>` +
    `<button class="go" data-i="${bi}">GO DAY</button></div>`;

  /* day summary card */
  html += `<div class="card" style="border-color:${rc}">` +
    `<h3>${sel === 0 ? "Today" : dt.toLocaleDateString("en-US", { weekday: "long" })} <span class="dt">${dt.toLocaleDateString("en-US", { month: "short", day: "numeric" })}</span></h3>` +
    `<div class="sub2">Best hour ${fmtT12(bh.time).replace(":00 ", " ")} · Go at ${best ? fmtT12(best.peak).replace(":00 ", " ") : "—"}</div>` +
    `<div class="ratingpill" style="background:${rc}"><span class="wc">${pompano(rc, 22)}</span>${d.score} ${word.toUpperCase()}</div>`;

  /* bite chips */
  html += `<div class="chips">` + d.wins.map(w => {
    const isBest = best && w.peak.getTime() === best.peak.getTime();
    const wsc = Math.max(0, Math.min(100, d.score + (w.moonMajor ? 8 : 0) + (isBest ? 5 : 0)));
    return `<span class="chip${isBest ? " best" : ""}">${pompano(isBest ? "#ffffff" : rc, 18)}` +
      `${fmtRange(w.start, w.end)} · ${wsc}${w.moonMajor ? " 🌙" : ""}</span>`;
  }).join("") + `</div>`;

  /* weather grid */
  const wx = wxInfo(d.wxCode);
  const w0 = d.hrs[0] || {};
  html += `<div class="wxgrid">` +
    `<div class="wxbox"><div class="k">💧 Water</div><div class="v">${d.waterTemp !== null ? d.waterTemp + "°F" : "—"}</div><div class="s">Waves to ${d.waveMax} ft</div></div>` +
    `<div class="wxbox sky"><div class="k">${wx.e} Sky</div><div class="v">${wx.t}</div><div class="s">Air ${d.tMax}° / ${d.tMin}°</div></div>` +
    `<div class="wxbox"><div class="k">🌧️ Rain chance</div><div class="v">${d.rainMax}%</div><div class="s">${d.rainMax < 20 ? "No rain" : d.rainMax < 50 ? "Possible showers" : "Likely rain"}</div></div>` +
    `<div class="wxbox"><div class="k">Wind ${compass(d.windDir)}</div><div class="v">${arrow(d.windDir)} ${d.windMax} <span style="font-size:13px">mph</span></div><div class="s">Gust ${Math.max(...d.hrs.map(h => h.gust), 0)} mph</div></div>` +
    `</div>`;

  /* major & minor list */
  html += `<div class="mmhead"><div class="t">All Major & Minor bites</div><div class="n">${allSol.length} windows</div></div>` +
    allSol.map(mm => {
      const isNext = nextSol && mm.start.getTime() === nextSol.start.getTime() && mm.kind === nextSol.kind;
      return `<div class="mmrow${isNext ? " next" : ""}">` +
        `<span class="mmbadge ${mm.kind === "MAJOR" ? "major" : "minor"}">${mm.kind}</span>` +
        `<span class="tt">${fmtRange(mm.start, mm.end)}</span>` +
        `<span class="mc">${mm.label}</span>` +
        (isNext ? `<span class="nextpill">NEXT</span>` : "") + `</div>`;
    }).join("");

  /* footnote */
  let dayLen = "";
  if (sky && sky.sunrise && sky.sunset){
    const ms = sky.sunset - sky.sunrise;
    dayLen = `${Math.floor(ms / 36e5)}h ${Math.round(ms % 36e5 / 6e4)}m`;
  }
  html += `<div class="footnote">` +
    `☀️ ${sky && sky.sunrise ? fmtT12(sky.sunrise).replace(" ", "") : "—"} – ${sky && sky.sunset ? fmtT12(sky.sunset).replace(" ", "") : "—"} (${dayLen}) · ` +
    `🌊 Surf to ${d.waveMax} ft · 🎯 Pompano sweet spot: moving water, 65–76°F<br>` +
    `🌙 ${sky ? sky.phase : "—"} · ${sky ? sky.illum : "—"} lit` +
    `</div></div>`;

  /* hour by hour */
  html += `<div class="hcard"><h3>Hour by hour</h3>` +
    `<div class="legend">${pompano("#1d9e6c", 16)} Good &nbsp;${pompano("#d98a16", 16)} Fair &nbsp;${pompano("#c93a2e", 16)} Bad</div>` +
    `<table class="htable"><tr><th>Hour</th><th>Pompano</th><th>Sky · Wind</th><th>Rain</th><th>Air/Wtr</th></tr>` +
    d.hrs.map(h => {
      const hx = wxInfo(h.code), c = rateColor(h.score);
      return `<tr class="${h.inBite ? "biterow" : ""}">` +
        `<td><b>${fmtT12(h.time).replace(":00 ", " ")}</b></td>` +
        `<td><span style="display:inline-flex;align-items:center;gap:4px">${pompano(c, 16)}<b style="color:${c}">${h.score}</b></span></td>` +
        `<td>${hx.e} ${arrow(h.wdir)} ${h.wind}</td>` +
        `<td>${h.rain}%</td>` +
        `<td>${h.temp}°</td></tr>`;
    }).join("") + `</table>` +
    `<div class="hfoot">Green-tinted rows fall inside a moving-tide bite window — prime pompano time. Scores weigh water temp, wind, rain, tide movement and moon overlap.</div></div>`;

  /* tide card */
  const nx = d.tides.map(p => ({ t: new Date(p.t).getTime(), type: p.type, v: parseFloat(p.v) }))
    .filter(p => p.t > nowMs).sort((a, b) => a.t - b.t)[0];
  const tideChips = d.tides.map(p => {
    const isNext = nx && new Date(p.t).getTime() === nx.t;
    const v = parseFloat(p.v);
    return `<span class="tchip ${p.type === "H" ? "hi" : "lo"}">${p.type === "H" ? "▲" : "▼"} ${p.type === "H" ? "High" : "Low"} ${fmtT12(new Date(p.t)).replace(":00 ", " ").replace(" ", "")} · ${v.toFixed(1)}ft</span>`;
  }).join("");
  html += `<div class="tidecard"><h3>🌊 Tide · ${sel === 0 ? "Today" : "This day"}</h3>` +
    `<div class="tidesub">${nx ? `Next ${nx.type === "H" ? "High" : "Low"} ${fmtT12(new Date(nx.t))} · ${nx.v.toFixed(1)} ft` : "—"} · range ${d.tideRange} ft</div>` +
    tideSVG(d, best) +
    `<div class="tidechips">${tideChips}</div></div>`;

  app.innerHTML = html;
  document.querySelectorAll("[data-i]").forEach(el =>
    el.addEventListener("click", () => render(+el.dataset.i)));
}

document.getElementById("refreshBtn").addEventListener("click", () => {
  document.getElementById("app").innerHTML = `<div class="loading">Checking pompano conditions…</div>`;
  load();
});
load().catch(() => {
  document.getElementById("app").innerHTML = `<div class="err">Couldn't load forecast data. Check your connection and reopen.</div>`;
});
setInterval(load, 3600e3);
document.addEventListener("visibilitychange", () => { if (!document.hidden) load(); });
</script>
</body>
</html>
