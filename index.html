<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#06121f">
<title>Fishing Forecast — Tien Huynh</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }
  body {
    background: #06121f; color: #eaf2fa;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif;
    max-width: 430px; margin: 0 auto; padding: 12px 12px 32px;
  }
  h1 { font-size: 19px; margin: 4px 0 2px; }
  h1 .name { color: #38bdf8; font-weight: 600; font-size: 15px; }
  .sub { color: #8fa8bd; font-size: 12px; margin-bottom: 12px; }
  .card {
    background: #0b1d31; border: 1px solid #1d3a56; border-radius: 14px;
    padding: 12px; margin-bottom: 10px;
  }
  .verdict { text-align: center; padding: 14px; }
  .verdict .row { display: flex; align-items: center; justify-content: center; gap: 10px; }
  .verdict .word { font-size: 30px; font-weight: 800; letter-spacing: 1px; }
  .verdict.good .word { color: #4ade80; }
  .verdict.bad .word { color: #f87171; }
  .verdict .score { color: #8fa8bd; font-size: 12px; margin-top: 2px; }
  .verdict .counts { font-size: 13px; margin-top: 8px; color: #cfe3f5; font-weight: 600; }
  .bite { display: flex; align-items: center; gap: 8px; padding: 7px 0; font-size: 13px; border-top: 1px solid #14293f; }
  .bite:first-child { border-top: none; }
  .bite .t { font-weight: 700; }
  .bite .tag { color: #8fa8bd; font-size: 11px; margin-left: auto; }
  .bite.next { background: #0e2a44; margin: 0 -12px; padding: 7px 12px; border-top: none; border-radius: 8px; }
  .conds { display: flex; justify-content: space-between; font-size: 13px; margin-top: 8px; }
  .conds .k { color: #8fa8bd; font-size: 10px; text-transform: uppercase; letter-spacing: .4px; }
  .conds .v { font-weight: 700; font-size: 15px; margin-top: 1px; }
  .sec-t { color: #8fa8bd; font-size: 11px; text-transform: uppercase; letter-spacing: .5px; margin-bottom: 6px; }
  .tide-svg { width: 100%; height: 110px; display: block; }
  .legend { font-size: 11px; color: #8fa8bd; margin-top: 4px; }
  .day { cursor: pointer; padding: 10px 12px; }
  .day.active { border-color: #38bdf8; }
  .day-head { display: flex; align-items: center; gap: 8px; }
  .day-name { font-weight: 700; font-size: 14px; flex: 1; }
  .day-meta { color: #8fa8bd; font-size: 12px; }
  .pill { font-size: 11px; font-weight: 800; padding: 3px 10px; border-radius: 999px; }
  .pill.good { background: #14532d; color: #4ade80; }
  .pill.bad { background: #450a0a; color: #f87171; }
  .detail { display: none; margin-top: 10px; border-top: 1px solid #1d3a56; padding-top: 10px; }
  .day.active .detail { display: block; }
  .hours { width: 100%; border-collapse: collapse; font-size: 12px; margin-top: 6px; }
  .hours th { color: #8fa8bd; font-weight: 600; text-align: left; padding: 4px 4px 4px 0; font-size: 11px; }
  .hours td { padding: 4px 4px 4px 0; border-top: 1px solid #14293f; }
  .err { color: #f87171; font-size: 13px; }
  .loading { color: #8fa8bd; text-align: center; padding: 40px 0; }
  .foot { color: #5b7186; font-size: 11px; text-align: center; margin-top: 16px; }
</style>
</head>
<body>
<h1>🎣 Fishing Forecast <span class="name">· Tien Huynh</span></h1>
<div class="sub">Jupiter, FL (26.92, −80.06) · <span id="updated">loading…</span></div>
<div id="app"><div class="loading">Loading forecast…</div></div>
<div class="foot">Live: Open-Meteo · Tides: NOAA 8722495 Jupiter Inlet · Rating is an estimate, not a guarantee.</div>

<script>
const LAT = 26.9166, LON = -80.0642, TZ = "America/New_York", STATION = "8722495";
const COMPASS = ["N","NNE","NE","ENE","E","ESE","SE","SSE","S","SSW","SW","WSW","W","WNW","NW","NNW"];
const compass = d => COMPASS[Math.round(d / 22.5) % 16];

function fishColor(s){ return s >= 60 ? "#4ade80" : s >= 40 ? "#facc15" : "#f87171"; }
function fishIcon(s, size){
  size = size || 22;
  const c = fishColor(s);
  return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" style="vertical-align:-5px;flex:none">` +
    `<path d="M2.5 12C5.3 7.8 8.8 5.8 12.6 5.8c2.7 0 5.2 1.5 7.2 4.2l1.7 2-1.7 2c-2 2.7-4.5 4.2-7.2 4.2-3.8 0-7.3-2-10.1-6.2z" fill="${c}"/>` +
    `<circle cx="15.8" cy="10.6" r="1.2" fill="#06121f"/></svg>`;
}

function fishScore(d){
  let s = 0;
  s += d.windMax <= 10 ? 30 : d.windMax <= 15 ? 22 : d.windMax <= 20 ? 12 : 4;
  s += d.rainMax < 20 ? 20 : d.rainMax < 40 ? 14 : d.rainMax < 60 ? 8 : 3;
  s += (d.waterTemp >= 65 && d.waterTemp <= 80) ? 20 : (d.waterTemp >= 60 && d.waterTemp <= 85) ? 14 : 8;
  s += d.waveMax < 1.5 ? 15 : d.waveMax < 3 ? 10 : 5;
  s += d.tideRange >= 2 ? 15 : 8;
  return Math.min(100, Math.round(s));
}

const fmtT = iso => {
  const d = new Date(iso);
  let h = d.getHours(); const ap = h >= 12 ? "p" : "a"; h = h % 12 || 12;
  return h + ":" + String(d.getMinutes()).padStart(2, "0") + ap;
};
const fmtTRange = (a, b) => fmtT(a) + "–" + fmtT(b);
const fmtDay = iso => new Date(iso + "T12:00:00")
  .toLocaleDateString("en-US", { weekday: "short", month: "numeric", day: "numeric", timeZone: TZ });
const dayKey = iso => iso.slice(0, 10);

function biteWindows(tides){
  return tides.map(p => {
    const c = new Date(p.t).getTime(), w = 90 * 60 * 1000;
    return { start: new Date(c - w), end: new Date(c + w), peak: new Date(p.t), type: p.type };
  });
}
function bestWindow(wins){
  const now = Date.now();
  const up = wins.filter(w => w.end.getTime() > now);
  return up.length ? up[0] : wins[0];
}

async function load(){
  const fUrl = `https://api.open-meteo.com/v1/forecast?latitude=${LAT}&longitude=${LON}` +
    `&hourly=temperature_2m,precipitation_probability,wind_speed_10m,wind_direction_10m` +
    `&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max,wind_speed_10m_max,wind_direction_10m_dominant` +
    `&timezone=${encodeURIComponent(TZ)}&wind_speed_unit=mph&temperature_unit=fahrenheit&forecast_days=7`;
  const mUrl = `https://marine-api.open-meteo.com/v1/marine?latitude=${LAT}&longitude=${LON}` +
    `&hourly=sea_surface_temperature,wave_height&timezone=${encodeURIComponent(TZ)}` +
    `&temperature_unit=fahrenheit&forecast_days=7`;
  const now = new Date();
  const bd = now.toISOString().slice(0, 10).replace(/-/g, "");
  const ed = new Date(now.getTime() + 7 * 864e5).toISOString().slice(0, 10).replace(/-/g, "");
  const tUrl = `https://api.tidesandcurrents.noaa.gov/api/prod/datagetter?product=predictions&datum=MLLW` +
    `&station=${STATION}&time_zone=lst_ldt&units=english&interval=hilo&format=json&begin_date=${bd}&end_date=${ed}`;

  const [f, m, t] = await Promise.all([
    fetch(fUrl).then(r => r.json()),
    fetch(mUrl).then(r => r.json()),
    fetch(tUrl).then(r => r.json()).catch(() => ({ predictions: [] }))
  ]);

  const days = f.daily.time.map((date, i) => {
    const hrs = f.hourly.time.map((t2, j) => j).filter(j => dayKey(f.hourly.time[j]) === date);
    let waveMax = 0, waterNoon = null, airNow = null;
    m.hourly.time.map((t2, j) => j).filter(j => dayKey(m.hourly.time[j]) === date).forEach(j => {
      const wv = (m.hourly.wave_height[j] || 0) * 3.28084;
      if (wv > waveMax) waveMax = wv;
      if (Math.abs(new Date(m.hourly.time[j]).getHours() - 12) < 2 && waterNoon === null)
        waterNoon = m.hourly.sea_surface_temperature[j];
    });
    if (i === 0) {
      let best = 1e15, bj = hrs[0];
      hrs.forEach(j => {
        const diff = Math.abs(new Date(f.hourly.time[j]).getTime() - Date.now());
        if (diff < best) { best = diff; bj = j; }
      });
      airNow = Math.round(f.hourly.temperature_2m[bj]);
    }
    const tides = (t.predictions || []).filter(p => dayKey(p.t) === date);
    const hs = tides.map(p => parseFloat(p.v));
    const d = {
      date, i,
      tMax: Math.round(f.daily.temperature_2m_max[i]),
      tMin: Math.round(f.daily.temperature_2m_min[i]),
      airNow,
      rainMax: f.daily.precipitation_probability_max[i] ?? 0,
      windMax: Math.round(f.daily.wind_speed_10m_max[i] ?? 0),
      windDir: compass(f.daily.wind_direction_10m_dominant[i] ?? 0),
      waterTemp: waterNoon !== null ? Math.round(waterNoon) : null,
      waveMax: Math.round(waveMax * 10) / 10,
      tideRange: hs.length ? Math.round((Math.max(...hs) - Math.min(...hs)) * 10) / 10 : 0,
      tides, hrs, f
    };
    d.score = fishScore(d);
    d.good = d.score >= 60;
    d.wins = biteWindows(tides);
    return d;
  });

  render(days);
}

function tideSVG(day, highlight){
  const pts = day.tides.map(p => ({ t: new Date(p.t), v: parseFloat(p.v), type: p.type }));
  if (pts.length < 2) return `<div class="legend">Tide data unavailable.</div>`;
  const W = 340, H = 104, P = 8;
  const vs = pts.map(p => p.v), vMin = Math.min(...vs), vMax = Math.max(...vs), vR = (vMax - vMin) || 1;
  const t0 = pts[0].t.getTime(), t1 = pts[pts.length - 1].t.getTime(), tR = (t1 - t0) || 1;
  const X = t => P + (t - t0) / tR * (W - 2 * P);
  const Y = v => H - P - (v - vMin) / vR * (H - 2 * P);
  let dAttr = "";
  const N = 110;
  for (let k = 0; k <= N; k++){
    const tt = t0 + tR * k / N;
    let seg = 0;
    while (seg < pts.length - 2 && pts[seg + 1].t.getTime() < tt) seg++;
    const a = pts[seg], b = pts[seg + 1];
    const fr = (tt - a.t.getTime()) / ((b.t.getTime() - a.t.getTime()) || 1);
    const v = a.v + (b.v - a.v) * (0.5 - 0.5 * Math.cos(Math.PI * Math.min(1, Math.max(0, fr))));
    dAttr += (k ? "L" : "M") + X(tt).toFixed(1) + "," + Y(v).toFixed(1);
  }
  let shades = "";
  day.wins.forEach(w => {
    const isBest = highlight && w.peak.getTime() === highlight.peak.getTime();
    const x1 = X(Math.max(t0, w.start.getTime())), x2 = X(Math.min(t1, w.end.getTime()));
    shades += `<rect x="${x1.toFixed(1)}" y="${P}" width="${(x2 - x1).toFixed(1)}" height="${H - 2 * P}"` +
      ` fill="${isBest ? "#4ade80" : "#14532d"}" opacity="${isBest ? "0.5" : "0.35"}" rx="4"/>`;
  });
  let marks = "";
  pts.forEach(p => {
    const x = X(p.t.getTime()), y = Y(p.v);
    marks += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3.5" fill="${p.type === "H" ? "#38bdf8" : "#fbbf24"}"/>` +
      `<text x="${x.toFixed(1)}" y="${(y - 8).toFixed(1)}" fill="#eaf2fa" font-size="10" text-anchor="middle">${p.type} ${fmtT(p.t)}</text>`;
  });
  let fish = "";
  if (highlight){
    const hx = X(highlight.peak.getTime());
    let seg = 0;
    while (seg < pts.length - 2 && pts[seg + 1].t.getTime() < highlight.peak.getTime()) seg++;
    const a = pts[seg], b = pts[seg + 1];
    const fr = (highlight.peak.getTime() - a.t.getTime()) / ((b.t.getTime() - a.t.getTime()) || 1);
    const v = a.v + (b.v - a.v) * (0.5 - 0.5 * Math.cos(Math.PI * Math.min(1, Math.max(0, fr))));
    const hy = Y(v), c = fishColor(day.score);
    fish = `<g transform="translate(${hx.toFixed(1)},${(hy - 16).toFixed(1)})">` +
      `<path d="M-11,0C-7,-4.5 -3.5,-6.5 0.5,-6.5c2.7,0 5.2,1.5 7.2,4.2l1.8,2.3-1.8,2.3c-2,2.7-4.5,4.2-7.2,4.2-3.8,0-7.5,-2-11,-6.5z" fill="${c}"/>` +
      `<circle cx="4" cy="-1.5" r="1.1" fill="#06121f"/></g>`;
  }
  const nowX = X(Date.now());
  const nowLine = (nowX > P && nowX < W - P)
    ? `<line x1="${nowX.toFixed(1)}" y1="${P}" x2="${nowX.toFixed(1)}" y2="${H - P}" stroke="#f87171" stroke-width="1.5"/>` : "";
  return `<svg class="tide-svg" viewBox="0 0 ${W} ${H}">${shades}` +
    `<path d="${dAttr}" fill="none" stroke="#38bdf8" stroke-width="2"/>${marks}${fish}${nowLine}</svg>` +
    `<div class="legend">🐟 = best bite · green band = prime window · 🔴 = now</div>`;
}

function inWin(timeISO, wins){
  const tt = new Date(timeISO).getTime();
  return wins.some(w => tt >= w.start.getTime() && tt <= w.end.getTime());
}

let countTimer = null;
function fmtDur(ms){
  const m = Math.max(0, Math.round(ms / 60000));
  const h = Math.floor(m / 60);
  return h ? h + "h " + (m % 60) + "m" : m + "m";
}
function startCountdowns(today){
  const el = document.getElementById("counts");
  if (!el) return;
  if (countTimer) clearInterval(countTimer);
  function tick(){
    const now = Date.now();
    const parts = [];
    const nx = today.tides
      .map(p => ({ t: new Date(p.t).getTime(), type: p.type }))
      .filter(p => p.t > now)[0];
    if (nx) parts.push(`⏳ ${nx.type === "H" ? "High" : "Low"} tide in ${fmtDur(nx.t - now)}`);
    const bw = today.wins.length ? bestWindow(today.wins) : null;
    if (bw){
      if (now >= bw.start.getTime() && now <= bw.end.getTime()) parts.push("🐟 Best bite NOW");
      else if (bw.start.getTime() > now) parts.push(`🐟 Best bite in ${fmtDur(bw.start.getTime() - now)}`);
    }
    el.innerHTML = parts.join(" &nbsp;·&nbsp; ");
  }
  tick();
  countTimer = setInterval(tick, 30000);
}

function render(days){
  const app = document.getElementById("app");
  const today = days[0];
  const best = today.wins.length ? bestWindow(today.wins) : null;

  let html = `<div class="card verdict ${today.good ? "good" : "bad"}">
      <div class="row">${fishIcon(today.score, 34)}<span class="word">${today.good ? "GOOD" : "BAD"}</span></div>
      <div class="score">${today.score}/100 · Today</div>
      <div class="counts" id="counts"></div>
    </div>`;

  html += `<div class="card"><div class="sec-t">🐟 Fish bite times today</div>`;
  if (today.wins.length){
    today.wins.forEach(w => {
      const isBest = best && w.peak.getTime() === best.peak.getTime();
      html += `<div class="bite${isBest ? " next" : ""}">${fishIcon(today.score, 20)}` +
        `<span class="t">${fmtTRange(w.start, w.end)}</span>` +
        `<span class="tag">${w.type === "H" ? "around high tide" : "around low tide"}${isBest ? " · BEST" : ""}</span></div>`;
    });
  } else {
    html += `<div class="bite">Tide data unavailable.</div>`;
  }
  html += `<div class="conds">
      <div><div class="k">Air</div><div class="v">${today.airNow !== null ? today.airNow + "°F" : today.tMax + "°F"}</div></div>
      <div><div class="k">Water</div><div class="v">${today.waterTemp !== null ? today.waterTemp + "°F" : "—"}</div></div>
      <div><div class="k">Rain</div><div class="v">${today.rainMax}%</div></div>
      <div><div class="k">Wind</div><div class="v">${today.windMax} ${today.windDir}</div></div>
    </div></div>`;

  html += `<div class="card"><div class="sec-t">Tide — Jupiter Inlet</div>${tideSVG(today, best)}</div>`;

  days.forEach((d, i) => {
    const label = i === 0 ? "Today" : fmtDay(d.date);
    const bw = d.wins.length ? bestWindow(d.wins) : null;
    html += `<div class="card day${i === 0 ? " active" : ""}">
      <div class="day-head">${fishIcon(d.score, 20)}<span class="day-name">${label}</span>
        <span class="day-meta">${d.tMax}°/${d.tMin}° · ${d.rainMax}% · ${d.windMax} ${d.windDir}</span>
        <span class="pill ${d.good ? "good" : "bad"}">${d.good ? "GOOD" : "BAD"}</span></div>
      <div class="detail">
        ${bw ? `<div class="bite">${fishIcon(d.score, 18)}<span class="t">${fmtTRange(bw.start, bw.end)}</span><span class="tag">best bite</span></div>` : ""}
        ${tideSVG(d, bw)}
        <table class="hours"><tr><th></th><th>Time</th><th>Air</th><th>Wind</th><th>Rain</th></tr>
        ${d.hrs.filter((_, k) => k % 3 === 0).map(j => {
          const hh = d.f.hourly, bite = inWin(hh.time[j], d.wins);
          return `<tr><td>${bite ? fishIcon(d.score, 16) : ""}</td><td>${fmtT(hh.time[j])}</td>` +
            `<td>${Math.round(hh.temperature_2m[j])}°</td>` +
            `<td>${Math.round(hh.wind_speed_10m[j])} ${compass(hh.wind_direction_10m[j])}</td>` +
            `<td>${hh.precipitation_probability[j] ?? 0}%</td></tr>`;
        }).join("")}</table>
      </div>
    </div>`;
  });

  app.innerHTML = html;
  document.getElementById("updated").textContent =
    "updated " + new Date().toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit", timeZone: TZ });
  app.querySelectorAll(".day").forEach(el => el.addEventListener("click", () => el.classList.toggle("active")));
  startCountdowns(today);
}

load().catch(() => {
  document.getElementById("app").innerHTML = `<div class="err">Couldn't load forecast data. Check your connection and reopen.</div>`;
});
setInterval(load, 3600e3);
document.addEventListener("visibilitychange", () => { if (!document.hidden) load(); });
</script>
</body>
</html>
