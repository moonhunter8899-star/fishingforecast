<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#f6f0df">
<title>Pompano Forecast — Tien Huynh</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700;9..144,800;9..144,900&family=Public+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }
  body {
    background: #f6f0df; color: #2b2620;
    font-family: "Public Sans", -apple-system, "Segoe UI", sans-serif;
    font-variant-numeric: tabular-nums;
  }
  .wrap { max-width: 960px; margin: 0 auto; padding: 12px 16px 40px; }
  html, body { overflow-x: hidden; }
  h1, h2, h3, .serif { font-family: "Fraunces", Georgia, serif; }

  /* Header */
  .hd { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; margin: 4px 2px 12px; }
  .hd .t1 { font-family: "Fraunces", serif; font-weight: 800; font-size: 16px; }
  .hd .t2 { color: #8a7a5f; font-size: 10px; margin-top: 2px; }
  .hd .brand { font-family: "Fraunces", serif; font-weight: 900; font-size: 15px; color: #22312b; }
  .hd .nick { font-size: 11px; font-weight: 700; color: #9a4a16; margin: 1px 0 7px; letter-spacing: .02em; }
  .hdBtns { display: flex; align-items: center; gap: 8px; flex: none; }
  .langbtn {
    background: #fffaf0; border: 1.5px solid #d9c9a3; border-radius: 999px;
    font-size: 11px; font-weight: 800; padding: 7px 10px; cursor: pointer; color: #8a7a5f;
  }
  .langbtn b { color: #9a4a16; }
  .watchlink { text-decoration: none; display: inline-block; }
  .refresh {
    background: #bc5a1e; color: #fff; border: none; border-radius: 999px;
    font-family: "Fraunces", serif; font-weight: 800; font-size: 13px;
    padding: 8px 16px; cursor: pointer; flex: none;
  }

  /* Top rating card */
  .topcard {
    position: relative; overflow: hidden;
    background: #22312b; border-radius: 22px; padding: 18px;
    border: 2px solid #1d9e6c;
    box-shadow: 0 4px 14px rgba(34,49,43,.25);
    margin-bottom: 14px; color: #fff;
  }
  .topcard .wm { position: absolute; top: -8px; right: 6px; opacity: .14; pointer-events: none; }
  .topcard .row { display: flex; align-items: center; gap: 16px; position: relative; padding: 2px 4px; }
  .badge {
    width: 58px; height: 58px; border-radius: 50%; background: #fff; flex: none;
    display: flex; align-items: center; justify-content: center;
  }
  .topcard .lbl { color: #e8c76a; font-size: 10px; font-weight: 700; letter-spacing: .18em; }
  .topcard .big { font-family: "Fraunces", serif; font-weight: 900; font-size: 30px; color: #fff; margin-top: 2px; }
  .topcard .big .sc { font-size: 22px; }
  .topcard .ddate { color: rgba(255,255,255,.78); font-size: 12px; font-weight: 600; margin-top: 6px; letter-spacing: .02em; }

  /* Day strip */
  .pick { display: flex; align-items: baseline; justify-content: space-between; margin: 2px 2px 8px; }
  .pick .ph { font-family: "Fraunces", serif; font-weight: 800; font-size: 13px; color: #9a4a16; }
  .pick .pr { font-size: 11px; color: #8a7a5f; }
  .strip { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin-bottom: 10px; }
  .dpill {
    background: #fffaf0; border: 1px solid #e3d5b3; border-radius: 12px; padding: 8px 2px 7px;
    text-align: center; cursor: pointer; position: relative; font-family: "Public Sans", sans-serif;
    color: #2b2620;
  }
  .dpill .dw { font-size: 10px; color: #8a7a5f; font-weight: 600; text-transform: uppercase; }
  .dpill .dn { font-family: "Fraunces", serif; font-size: 18px; font-weight: 800; }
  .dpill .dsc { font-size: 12px; font-weight: 800; }
  .dpill .dow2 { font-size: 8px; color: #8a7a5f; white-space: nowrap; letter-spacing: 0; }
  .dpill.sel { color: #fff; border-color: transparent; }
  .dpill.sel .dw, .dpill.sel .dow2 { color: rgba(255,255,255,.85); }
  .dpill.best { background: #fff3cf; border: 2px solid #d9a441; box-shadow: 0 0 8px rgba(217,164,65,.5); }
  .dpill .bestbadge {
    position: absolute; top: -9px; left: 50%; transform: translateX(-50%);
    background: #6b4a1f; color: #ffe9a8; font-size: 8px; font-weight: 800;
    padding: 2px 6px; border-radius: 999px; letter-spacing: .06em; white-space: nowrap;
  }
  .bestbanner {
    display: flex; align-items: center; gap: 10px;
    background: #fff3cf; border-radius: 12px; padding: 9px 12px; margin-bottom: 14px;
    font-size: 12px; font-weight: 600; color: #6b4a1f;
  }
  .bestbanner .star {
    width: 26px; height: 26px; border-radius: 50%; background: #d9a441; color: #fff;
    display: flex; align-items: center; justify-content: center; font-size: 14px; flex: none;
  }
  .bestbanner .go {
    margin-left: auto; background: #6b4a1f; color: #ffe9a8; border: none; border-radius: 999px;
    font-size: 10px; font-weight: 800; padding: 6px 12px; cursor: pointer; letter-spacing: .06em; flex: none;
  }
  .bestbanner .bt { font-family: "Fraunces", serif; font-weight: 800; font-size: 11px; letter-spacing: .08em; }

  /* Day card */
  .card {
    background: #fffaf0; border-radius: 20px; padding: 16px; margin-bottom: 14px;
    border: 1.5px solid #1d9e6c;
  }
  .card h3 { margin: 0; font-size: 19px; font-weight: 900; }
  .card h3 .dt { font-family: "Public Sans", sans-serif; font-size: 12px; font-weight: 600; color: #8a7a5f; }
  .card h3 .tday { color: #fff; font-size: 12px; font-weight: 900; letter-spacing: .06em;
    padding: 4px 11px; border-radius: 999px; vertical-align: 3px; white-space: nowrap; }
  .card h3 .drate { display: inline-flex; align-items: center; gap: 4px; margin-left: 8px;
    font-family: "Public Sans", sans-serif; font-size: 14px; font-weight: 800; white-space: nowrap; }
  .card h3 .drate svg { vertical-align: -4px; }

  /* GO FISH band */
  .gofish {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    background: #bc5a1e; color: #fff; border-radius: 14px; padding: 11px 14px;
    margin: 12px 0; font-family: "Fraunces", serif; font-weight: 900; font-size: 19px;
    box-shadow: 0 3px 10px rgba(188,90,30,.35);
  }
  .gofish .gl { font-size: 15px; letter-spacing: .04em; }
  .gofish .gt { margin-left: 2px; }
  .gofish .gs { margin-left: auto; font-size: 17px; white-space: nowrap; }
  .gofish.past { overflow: hidden; }
  .gofish.past .swim { display: inline-block; margin-left: auto; animation: swimaway 6s ease-in-out infinite; }
  @keyframes swimaway {
    0%   { transform: translateX(0) translateY(0) rotate(0deg); opacity: 0; }
    12%  { transform: translateX(6px) translateY(0) rotate(0deg); opacity: 1; }
    30%  { transform: translateX(48px) translateY(-7px) rotate(6deg); opacity: 1; }
    55%  { transform: translateX(92px) translateY(5px) rotate(-5deg); opacity: .85; }
    78%  { transform: translateX(132px) translateY(-4px) rotate(4deg); opacity: .3; }
    92%, 100% { transform: translateX(152px) translateY(0) rotate(0deg); opacity: 0; }
  }
  /* catch logger row inside the GO FISH band */
  .catchrow {
    display: flex; align-items: center; gap: 8px; width: 100%;
    font-family: "Public Sans", sans-serif; font-size: 12px; font-weight: 700;
  }
  .catchrow .ck { opacity: .92; white-space: nowrap; }
  .cbtn {
    width: 26px; height: 26px; border-radius: 50%; border: none; padding: 0; flex: none;
    background: rgba(255,255,255,.28); color: #fff;
    font-size: 16px; font-weight: 800; line-height: 1; cursor: pointer;
  }
  .cnum { min-width: 22px; text-align: center; font-size: 15px; font-weight: 800; }
  .cmsg { font-weight: 600; opacity: .96; }

  /* 4 weather tiles */
  .tiles { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin-bottom: 16px; }
  .tile { background: #ede4cc; border-radius: 12px; padding: 10px 6px; text-align: center; }
  .tile .k { font-size: 9px; font-weight: 700; letter-spacing: .06em; color: #8a7a5f; text-transform: uppercase; }
  .tile .v { font-family: "Fraunces", serif; font-size: 15px; font-weight: 800; margin-top: 3px; white-space: nowrap; }
  .tile .v svg { vertical-align: -4px; }
  .tile .msub { font-size: 9px; font-weight: 700; color: #8a7a5f; margin-top: 2px; white-space: nowrap; }

  /* Major / Minor section */
  .moonsec { margin-bottom: 16px; }
  .moonsec .mh { font-family: "Fraunces", serif; font-weight: 800; font-size: 15px; color: #9a4a16; margin-bottom: 2px; }
  .cdline { font-size: 11px; color: #8a7a5f; margin: 0 0 8px; font-weight: 600; }
  .mrow {
    display: flex; align-items: center; gap: 10px;
    background: #f3ecda; border: 1px solid #e0d2ae; border-radius: 12px;
    padding: 9px 12px; margin-bottom: 7px; font-weight: 700; font-size: 14px;
  }
  .mrow.now { background: #fff3cf; border: 2px solid #d9a441; box-shadow: 0 0 8px rgba(217,164,65,.45); }
  .mbadge {
    font-size: 10px; font-weight: 800; letter-spacing: .06em; border-radius: 7px;
    padding: 4px 8px; flex: none;
  }
  .mbadge.major { background: #bc5a1e; color: #fff; }
  .mbadge.minor { background: #e3d5b3; color: #6b5f4c; }
  .mrow .mt { font-family: "Fraunces", serif; font-weight: 800; }
  .nowpill {
    margin-left: auto; background: #1d9e6c; color: #fff; font-size: 10px; font-weight: 800;
    border-radius: 999px; padding: 3px 10px; letter-spacing: .06em; flex: none;
  }

  /* Tide section */
  .tidesec .th { font-family: "Fraunces", serif; font-weight: 800; font-size: 15px; color: #0f766e; margin-bottom: 2px; }
  .tidechart { width: 100%; height: auto; display: block; margin: 4px 0 8px; }
  .tchips { display: flex; flex-wrap: wrap; gap: 8px; }
  .tchip {
    display: inline-flex; align-items: center; gap: 6px; border-radius: 999px;
    padding: 6px 12px; font-size: 12px; font-weight: 700;
    background: #ede4cc; border: 1px solid #d9c9a3; color: #2b2620;
  }
  .tchip.hi { background: #bc5a1e; border-color: #bc5a1e; color: #fff; }

  /* Hour by hour */
  .hsec .hh2 { font-family: "Fraunces", serif; font-weight: 800; font-size: 15px; color: #9a4a16; margin-bottom: 6px; }
  .htable { width: 100%; border-collapse: collapse; font-size: 12px; table-layout: fixed; }
  th.hhour, td.hhour { width: 15%; }
  th.hscore, td.hscore { width: 18%; }
  th.hskyw, td.hskyw { width: 35%; }
  th.hrain, td.hrain { width: 12%; }
  th.htemp, td.htemp { width: 20%; }
  .htable th {
    font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em;
    color: #8a7a5f; text-align: left; padding: 4px 6px; border-bottom: 1px solid #e3d5b3;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .htable td { padding: 6px; border-bottom: 1px solid #f0e7d2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .htable tr:last-child td { border-bottom: none; }
  .hrow.inbite td { background: rgba(29,158,108,.12); }
  .hhour { font-family: "Fraunces", serif; font-weight: 800; }
  .hscore { font-weight: 800; }
  .hscore svg { vertical-align: -5px; }
  .hint { font-size: 10px; color: #8a7a5f; margin: 8px 2px 0; font-weight: 600; }

  .loading, .err { text-align: center; padding: 40px 16px; color: #8a7a5f; font-size: 14px; }
  .err button { margin-top: 10px; }
  .foot { text-align: center; color: #b3a37f; font-size: 10px; margin-top: 18px; }

  /* ===== responsive: phone -> desktop ===== */
  /* hourly table is fluid at every width: fixed layout + % columns, never scrolls */
  .hwrap { overflow-x: visible; }
  .dpill { min-height: 48px; }
  @media (max-width: 700px) {
    .tiles { grid-template-columns: repeat(3, 1fr); }
  }
  @media (max-width: 430px) {
    .wrap { padding: 10px 10px 32px; }
    .tiles { grid-template-columns: repeat(2, 1fr); }
    .strip { gap: 4px; }
    .dpill { padding: 8px 1px 7px; }
    .topcard .big { font-size: 26px; }
    .gofish { font-size: 17px; }
    /* hourly table stays compact on phones (column widths are set globally above) */
    .htable { font-size: 11px; }
    .htable th, .htable td { padding: 5px 3px; }
    .hscore svg { width: 16px; height: 16px; }
  }
  @media (min-width: 901px) {
    .wrap { padding: 16px 24px 48px; }
    .strip { gap: 8px; }
  }
</style>
</head>

/* ================= helpers ================= */
function $(id) { return document.getElementById(id); }
function pad(n) { return (n < 10 ? "0" : "") + n; }
function compass(deg) {
  var dirs = ["N","NNE","NE","ENE","E","ESE","SE","SSE","S","SSW","SW","WSW","W","WNW","NW","NNW"];
  return dirs[Math.round(deg / 22.5) % 16];
}
function tstr(d, lang) { // 12h in both languages, e.g. "7:35p"
  var h = d.getHours(), ap = h >= 12 ? "p" : "a";
  h = h % 12; if (h === 0) h = 12;
  return h + ":" + pad(d.getMinutes()) + ap;
}
function trange(a, b, lang) { return tstr(a, lang) + "–" + tstr(b, lang); }
function clockStr(lang) { // 12h in both languages, e.g. "2:26 PM"
  var d = new Date();
  var h = d.getHours(), ap = h >= 12 ? "PM" : "AM";
  h = h % 12; if (h === 0) h = 12;
  return h + ":" + pad(d.getMinutes()) + " " + ap;
}
function fullDateStr(date, lang) { // EN: "Fri, Oct 9, 2026" · VI: "T6, 9 Th10 2026"
  var S = STR[lang];
  if (lang === "vi") {
    return S.days[date.getDay()] + ", " + date.getDate() + " " + S.months[date.getMonth()] + " " + date.getFullYear();
  }
  var dn = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"][date.getDay()];
  return dn + ", " + S.months[date.getMonth()] + " " + date.getDate() + ", " + date.getFullYear();

    if (pastWindow) {
      html += '<div class="gofish past">' +
        '<span class="gl">' + S.gotAway + '</span>' +
        '<span class="swim">' + fishSVG(ratingColor(bsc), 30) + "</span>" +
        catchRowHTML(day.date) + "</div>";
    } else {
      html += '<div class="gofish">' +
        '<span class="gl">🎣 ' + S.goFish + '</span><span class="gt">' +
        trange(day.best.start, day.best.end, state.lang) + '</span><span class="gs">· 🐟 ' + bsc + "</span>" +
        catchRowHTML(day.date) + "</div>";
    }
  }
  var cn = condIcon(day.condCode, day.condDay) + " " + (S.condName[day.condCode] || S.condName[2]);
  var mph = (state.moonPhase && state.moonPhase[ymdDash(day.date)] != null) ? state.moonPhase[ymdDash(day.date)] : null;
  var moonTile;
  if (mph == null) {
    moonTile = '<div class="tile"><div class="k">' + S.moon + '</div><div class="v">—</div></div>';
  } else {
    var mp = moonPhaseInfo(mph);
    var msub = mp.daysToFull === 0 ? S.fullTonight : S.fullIn(mp.daysToFull);
    moonTile = '<div class="tile"><div class="k">' + S.moon + '</div><div class="v">' + moonPhaseSVG(mph, 1.3) + " " +
      Math.round(mp.illum * 100) + '%</div><div class="msub">' + msub + "</div></div>";
  }
  html += '<div class="tiles">' +
    '<div class="tile"><div class="k">' + _lblWind() + ' ' + S.wind + '</div><div class="v">' + day.wind + (day.gust != null ? " | " + day.gust : "") + " " + day.windDir + "</div></div>" +
    '<div class="tile"><div class="k">' + _lblWater() + ' ' + S.water + '</div><div class="v">' + day.water.toFixed(1) + "°F</div></div>" +
    '<div class="tile"><div class="k">' + S.cond + '</div><div class="v">' + cn + "</div></div>" +
    '<div class="tile"><div class="k">' + _lblRain() + ' ' + S.rain + '</div><div class="v">' + day.rain + "%</div></div>" +
    moonTile +
    "</div>";
  // major/minor
  var moonRows = moonRowsHTML(day);
  html += '<div class="moonsec"><div class="mh">' + S.moonTitle + "</div>" +
    '<p class="cdline" id="moonCd">' + moonCountdownHTML() + "</p>" +
    (moonRows ? '<div id="moonRows">' + moonRows + "</div>"
              : '<p class="cdline">' + S.moonNote + "</p>") + "</div>";
  // tide
  html += '<div class="tidesec"><div class="th">🌊 ' + S.tide + " · " +
    (state.sel === 0 ? S.todayWord : S.days[day.date.getDay()] + " " + day.date.getDate()) + "</div>" +
    (state.tides.length
      ? '<p class="cdline" id="tideCd">' + tideCountdownHTML() + "</p>" +
        tideSVG(day) + '<div class="tchips">' + tideChipsHTML(day) + "</div>"
      : '<p class="cdline">' + S.tideNote + "</p>") + "</div>";
  html += "</div>";
  // hour-by-hour card for the selected day, after the tide chart
  html += hourlyHTML(day);
  app.innerHTML = html;
  // wire buttons
  var pills = app.querySelectorAll("[data-day]");
  for (var i = 0; i < pills.length; i++) {
    (function(el) {
      el.addEventListener("click", function() { state.sel = +el.getAttribute("data-day"); renderAll(); });
    })(pills[i]);
  }
  var go = app.querySelector("[data-goday]");
  if (go) go.addEventListener("click", function() { state.sel = +go.getAttribute("data-goday"); renderAll(); });
  var cday = state.days[state.sel];
  var cmn = $("catchMinus"), cpl = $("catchPlus");
  if (cmn && cday) cmn.addEventListener("click", function() { bumpCatch(cday.date.getTime(), -1); });
  if (cpl && cday) cpl.addEventListener("click", function() { bumpCatch(cday.date.getTime(), 1); });
}
function tick() {
  if (!state.ready) return;
  var clk = $("clock");
  if (clk) clk.textContent = clockStr(state.lang);
  var mc = $("moonCd");
  if (mc) mc.textContent = moonCountdownHTML();
  var tc = $("tideCd");
  if (tc) tc.textContent = tideCountdownHTML();
  var mr = $("moonRows");
  if (mr && state.days[state.sel]) mr.innerHTML = moonRowsHTML(state.days[state.sel]);
  renderHeader();
  // if the phone's real clock has rolled past the rendered day (page left open
  // across midnight), silently refetch so the rod, countdowns and scores match
  // the real current day — never a stale or wrongly-placed marker
  var nowMs = Date.now();
  if (!state.loading && state.tideScale &&
      (nowMs < state.tideScale.d0 || nowMs >= state.tideScale.d0 + 86400000)) {
    startLoad();
    return;
  }
  // move the live tide-chart rod every 30s so it rides the curve with the real time
  if (++__tfN % 30 === 0) moveTideFish();
}
// repositions the #tiderod marker along the tide curve to the current time
var __tfN = 0;
function moveTideFish() {
  var t = document.getElementById("tiderod"), sc = state.tideScale;
  if (!t || !sc || !state.ready) return;
  var now = Date.now(), d1 = sc.d0 + 86400000;
  if (now < sc.d0 || now > d1) {
    t.style.display = "none";
    return;
  }
  t.style.display = "";
  var fx = sc.pL + (now - sc.d0) / 86400000 * (sc.W - sc.pL - sc.pR);
  var fy = sc.pT + (1 - (tideAt(now) - sc.mn) / (sc.mx - sc.mn)) * (sc.H - sc.pT - sc.pB);
  t.setAttribute("transform", "translate(" + fx.toFixed(1) + "," + fy.toFixed(1) + ")");
  var rt = document.getElementById("rodtim");
  if (rt) rt.textContent = clockStr(state.lang);
}
function showError() {
  var S = STR[state.lang];
  $("app").innerHTML = '<div class="err">' + S.loadFail +
    '<br><button class="refresh" onclick="boot(true)">' + S.retry + "</button></div>";
}
function dedupeMoon(wins) {
  wins.sort(function(a, b) { return a.start - b.start; });
  var out = [];
  wins.forEach(function(w) {
    var last = out[out.length - 1];
    if (last && last.type === w.type && w.start <= last.end + 600000) {
      last.end = Math.max(last.end, w.end);
    } else out.push(w);
  });
  return out;
}
// Always pinned to Jupiter Inlet — no GPS, no location prompt.
function startLoad() {
  var lat = PIN.lat, lon = PIN.lon, station = PIN.station;
  state.loading = true;
  state.loc = {
    name: PIN.name, lat: lat, lon: lon, station: station
  };
  renderHeader();
  var fromD = new Date(); fromD.setDate(fromD.getDate() - 1);
  var toD = new Date(); toD.setDate(toD.getDate() + 7);
  var moonPs = [];
  for (var i = 0; i < 8; i++) {
    var dt = new Date(); dt.setDate(dt.getDate() + i);
    moonPs.push(loadMoonDay(lat, lon, dt));
  }
  // Each source is independent: weather+marine are essential, but tides and moon
  // degrade gracefully (quiet note instead of a full-page error).
  Promise.all([
      loadWeather(lat, lon).catch(function(e) { return { _err: e }; }),
      loadMarine(lat, lon).catch(function(e) { return { _err: e }; }),
      loadTides(station, fromD, toD).catch(function() { return []; }),
      Promise.all(moonPs)
    ])
    .then(function(r) {
      try {
        if (r[0]._err || r[1]._err) { state.loading = false; showError(); return; }
        var wx = r[0], mar = r[1];
        state.wx = wx; state.mar = mar;
        state.tides = r[2];
        var all = [];
        r[3].forEach(function(arr) { arr.forEach(function(w) { all.push(w); }); });
        state.moon = dedupeMoon(all);
        state.days = buildDays(wx, mar);
        state.sel = 0;
        state.ready = true; state.loading = false;
        state.updatedAt = new Date();
        renderAll();
      } catch (e) { state.loading = false; showError(); }
    })
    .catch(function() { state.loading = false; showError(); });
}
function boot() {
  state.ready = false; state.sel = 0; state.days = []; state.moonPhase = {};
  var S = STR[state.lang];
  document.documentElement.lang = state.lang;
  $("app").innerHTML = '<div class="loading">' + S.loading + "</div>";
  renderHeader();
  startLoad(); // always pinned to Jupiter Inlet — no GPS
}
$("langBtn").addEventListener("click", function() {
  state.lang = state.lang === "en" ? "vi" : "en";
  localStorage.setItem("pf_lang", state.lang);
  document.documentElement.lang = state.lang;
  if (state.ready) renderAll(); else boot();
});
$("refBtn").addEventListener("click", function() { boot(); });
boot();
setInterval(tick, 1000);
</script>
