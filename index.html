<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Fishing Forecast">
<meta name="theme-color" content="#0b2231">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="manifest" href="manifest.json">
<title>Fishing Forecast</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700;9..144,800;9..144,900&family=Public+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; overflow-x: hidden; }
  body {
    font-family: "Public Sans", -apple-system, "Segoe UI", sans-serif;
    min-height: 100vh; color: #fff;
  }
  .bg {
    position: fixed; inset: 0; z-index: -2;
    background: url("landing-bg.jpg") center 32%/cover no-repeat;
  }
  .bgshade {
    position: fixed; inset: 0; z-index: -1;
    background: linear-gradient(180deg, rgba(8,24,34,.44) 0%, rgba(8,24,34,.10) 34%, rgba(8,24,34,.06) 55%, rgba(8,24,34,.52) 100%);
  }
  .wrap { max-width: 720px; margin: 0 auto; padding: 12px 16px 40px; }
  .hd { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; margin: 4px 2px 6px; }
  .brand {
    font-family: "Fraunces", Georgia, serif; font-weight: 900; font-size: 19px; color: #fff;
    text-shadow: 0 1px 10px rgba(0,20,30,.55); letter-spacing: .01em;
  }
  .langbtn {
    background: rgba(255,255,255,.16); border: 1.5px solid rgba(255,255,255,.55); border-radius: 999px;
    font-size: 11px; font-weight: 800; padding: 7px 12px; cursor: pointer; color: #fff; flex: none;
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    text-shadow: 0 1px 6px rgba(0,20,30,.5);
  }
  .langbtn b { color: #ffd9a0; }
  .q {
    font-family: "Fraunces", Georgia, serif; font-weight: 800; font-size: 24px; color: #fff;
    text-align: center; margin: 26px 8px 6px; line-height: 1.25;
    text-shadow: 0 2px 14px rgba(0,20,30,.6);
  }
  .qsub {
    text-align: center; color: rgba(255,255,255,.88); font-size: 12.5px; font-weight: 600;
    margin: 0 8px 22px; text-shadow: 0 1px 8px rgba(0,20,30,.6);
  }
  .cards { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .spcol { display: flex; flex-direction: column; }
  .spcard2 {
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
    aspect-ratio: 1; border-radius: 18px; text-decoration: none;
    background: linear-gradient(160deg, rgba(255,255,255,.85), rgba(255,255,255,.60));
    border: 1.5px solid rgba(11,110,168,.55);
    box-shadow: 0 12px 32px rgba(4,20,30,.30), inset 0 1px 0 rgba(255,255,255,.7);
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    transition: transform .12s ease;
  }
  .spcard2:active { transform: scale(.97); }
  .spfish {
    display: block; background: #8f959b;
    -webkit-mask-repeat: no-repeat; -webkit-mask-position: center; -webkit-mask-size: contain;
    mask-repeat: no-repeat; mask-position: center; mask-size: contain;
  }
  .spfish.snook { width: 78%; aspect-ratio: 2.637; -webkit-mask-image: url(icons/snook-silhouette.png); mask-image: url(icons/snook-silhouette.png); }
  .spfish.pomp { width: 66%; aspect-ratio: 1.946; -webkit-mask-image: url(icons/pompano-silhouette.png); mask-image: url(icons/pompano-silhouette.png); }
  .spname {
    font-family: "Fraunces", Georgia, serif; font-weight: 900; font-size: 21px;
    letter-spacing: .06em; color: #1d3a4a; text-align: center; line-height: 1.3;
  }
  .seasrow { text-align: center; margin-top: 10px; min-height: 26px; }
  .season {
    display: inline-block; font-size: 11px; font-weight: 800; letter-spacing: .05em;
    border-radius: 999px; padding: 5px 12px; color: #fff; white-space: nowrap;
    box-shadow: 0 2px 10px rgba(4,20,30,.35);
  }
  .season.open { background: #1d9e6c; }
  .season.closed { background: #c0392b; }
  .cont {
    text-align: center; margin-top: 22px; font-size: 13px; font-weight: 700;
    color: rgba(255,255,255,.92); text-shadow: 0 1px 8px rgba(0,20,30,.6);
  }
  .cont a { color: #ffe3b3; text-decoration: none; border-bottom: 2px solid #ffe3b3; padding-bottom: 1px; }
  .foot {
    text-align: center; color: rgba(255,255,255,.78); font-size: 10.5px; margin-top: 28px;
    text-shadow: 0 1px 6px rgba(0,20,30,.6); letter-spacing: .04em;
  }
  @media (max-width: 430px) {
    .q { font-size: 20px; }
    .cards { gap: 12px; }
    .spcard2 { gap: 10px; border-radius: 14px; }
    .spname { font-size: 15px; }
  }
</style>
</head>
<body>
<div class="bg"></div><div class="bgshade"></div>
<div class="wrap">
  <div class="hd">
    <div>
      <div class="brand">Fishing Forecast</div>
    </div>
    <button class="langbtn" id="langBtn"></button>
  </div>
  <div class="q" id="q"></div>
  <p class="qsub" id="qsub"></p>
  <div class="cards">
    <div class="spcol">
      <a class="spcard2" href="snook.html">
        <span class="spfish snook"></span>
        <span class="spname">SNOOK<br>FORECAST</span>
      </a>
      <div class="seasrow"><span class="season" id="seasSnook"></span></div>
    </div>
    <div class="spcol">
      <a class="spcard2" href="pompano.html">
        <span class="spfish pomp"></span>
        <span class="spname">POMPANO<br>FORECAST</span>
      </a>
      <div class="seasrow"><span class="season" id="seasPomp"></span></div>
    </div>
  </div>
  <div class="cont" id="cont"></div>
  <div class="foot">Fishing Forecast - Tien Huynh</div>
</div>
<script>
"use strict";
var STR = {
  en: {
    q: "What are you fishing for today?",
    qsub: "Tap a card — each fish gets its own forecast.",
    last: "Last time",
    go: "continue →",
    fish: { snook: "Snook", pompano: "Pompano" },
    seasonOpen: function(d) { return "OPEN · " + d + "d left"; },
    seasonClosed: function(d) { return "CLOSED · opens in " + d + "d"; },
    seasonYear: "OPEN · year-round"
  },
  vi: {
    q: "Hôm nay bạn câu cá gì?",
    qsub: "Chạm vào một thẻ — mỗi loại cá có dự báo riêng.",
    last: "Lần trước",
    go: "tiếp tục →",
    fish: { snook: "Snook", pompano: "Pompano" },
    seasonOpen: function(d) { return "MỞ · còn " + d + "n"; },
    seasonClosed: function(d) { return "ĐÓNG · mở sau " + d + "n"; },
    seasonYear: "MỞ · quanh năm"
  }
};
var lang = "en";
try { lang = localStorage.getItem("pf_lang") || "en"; } catch (e) {}
/* FWC Atlantic snook harvest seasons (Jupiter Inlet is Atlantic):
   open Feb 1–May 31 and Sep 1–Dec 14; closed Dec 15–Jan 31 and Jun 1–Aug 31.
   Pompano has no closed season in FL state waters (open year-round). */
function snookSeason() {
  var now = new Date(); now.setHours(0, 0, 0, 0);
  var y = now.getFullYear();
  function D(m, d, yy) { return new Date(yy === undefined ? y : yy, m - 1, d); }
  var open = false, target;
  if (now >= D(2, 1) && now <= D(5, 31)) { open = true; target = D(5, 31); }
  else if (now >= D(9, 1) && now <= D(12, 14)) { open = true; target = D(12, 14); }
  else if (now >= D(12, 15)) { target = D(2, 1, y + 1); }
  else if (now < D(2, 1)) { target = D(2, 1); }
  else { target = D(9, 1); }
  var days = Math.max(0, Math.round((target - now) / 86400000));
  return { open: open, days: days };
}
function seasonPill(kind) {
  var S = STR[lang];
  if (kind === "pompano") return '<span class="season open">' + S.seasonYear + "</span>";
  var r = snookSeason();
  return '<span class="season ' + (r.open ? "open" : "closed") + '">' +
    (r.open ? S.seasonOpen(r.days) : S.seasonClosed(r.days)) + "</span>";
}
function render() {
  var S = STR[lang];
  document.documentElement.lang = lang;
  document.getElementById("q").textContent = S.q;
  document.getElementById("qsub").textContent = S.qsub;
  document.getElementById("langBtn").innerHTML = lang === "en" ? "<b>EN</b> | VI" : "EN | <b>VI</b>";
  document.getElementById("seasSnook").innerHTML = seasonPill("snook");
  document.getElementById("seasPomp").innerHTML = seasonPill("pompano");
  var cont = document.getElementById("cont"), sp = null;
  try { sp = localStorage.getItem("ff_species"); } catch (e) {}
  if (sp === "snook" || sp === "pompano") {
    cont.innerHTML = S.last + ": <a href=\"" + sp + ".html\">" + S.fish[sp] + " " + S.go + "</a>";
  } else {
    cont.innerHTML = "";
  }
}
document.getElementById("langBtn").addEventListener("click", function() {
  lang = lang === "en" ? "vi" : "en";
  try { localStorage.setItem("pf_lang", lang); } catch (e) {}
  render();
});
render();
</script>
</body>
</html>
