<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Fishing Forecast">
<meta name="theme-color" content="#0f766e">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="manifest" href="manifest.json">
<title>Fishing Forecast</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700;9..144,800;9..144,900&family=Public+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; overflow-x: hidden; }
  body {
    background: #f6f0df; color: #2b2620;
    font-family: "Public Sans", -apple-system, "Segoe UI", sans-serif;
    min-height: 100vh;
  }
  .wrap { max-width: 720px; margin: 0 auto; padding: 12px 16px 40px; }
  .hd { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; margin: 4px 2px 6px; }
  .brand { font-family: "Fraunces", Georgia, serif; font-weight: 900; font-size: 17px; color: #22312b; }
  .nick { font-size: 11px; font-weight: 700; color: #9a4a16; margin: 2px 0 0; letter-spacing: .02em; }
  .langbtn {
    background: #fffaf0; border: 1.5px solid #d9c9a3; border-radius: 999px;
    font-size: 11px; font-weight: 800; padding: 7px 10px; cursor: pointer; color: #8a7a5f; flex: none;
  }
  .langbtn b { color: #9a4a16; }
  .q {
    font-family: "Fraunces", Georgia, serif; font-weight: 800; font-size: 22px;
    color: #22312b; text-align: center; margin: 18px 8px 4px;
  }
  .qsub { text-align: center; color: #8a7a5f; font-size: 12px; font-weight: 600; margin: 0 8px 18px; }
  .cards { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .spcard {
    display: block; border-radius: 22px; overflow: hidden; text-decoration: none;
    border: none; box-shadow: 0 6px 18px rgba(34,49,43,.22);
    transition: transform .12s ease, box-shadow .12s ease; background: #0b5f8a;
  }
  .spcard:active { transform: scale(.97); box-shadow: 0 3px 10px rgba(34,49,43,.25); }
  .spcard img { display: block; width: 100%; height: auto; }
  .cont { text-align: center; margin-top: 20px; font-size: 13px; font-weight: 700; }
  .cont a { color: #0f766e; text-decoration: none; border-bottom: 2px solid #0f766e; padding-bottom: 1px; }
  .foot { text-align: center; color: #b3a37f; font-size: 10px; margin-top: 26px; }
  @media (max-width: 430px) {
    .q { font-size: 19px; }
    .cards { gap: 10px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="hd">
    <div>
      <div class="brand">🎣 Fishing Forecast</div>
      <div class="nick">Tư Tò Tò – Nha Trang · Jupiter Inlet, FL</div>
    </div>
    <button class="langbtn" id="langBtn"></button>
  </div>
  <div class="q" id="q"></div>
  <p class="qsub" id="qsub"></p>
  <div class="cards">
    <a class="spcard" href="snook.html"><img src="icons/snook-card.png" alt="Snook Forecast"></a>
    <a class="spcard" href="pompano.html"><img src="icons/pompano-card.png" alt="Pompano Forecast"></a>
  </div>
  <div class="cont" id="cont"></div>
  <div class="foot">Fishing Forecast · Tien Huynh</div>
</div>
<script>
"use strict";
var STR = {
  en: {
    q: "What are you fishing for today?",
    qsub: "Tap a card — each fish gets its own forecast.",
    last: "Last time",
    go: "continue →",
    fish: { snook: "Snook", pompano: "Pompano" }
  },
  vi: {
    q: "Hôm nay bạn câu cá gì?",
    qsub: "Chạm vào một thẻ — mỗi loại cá có dự báo riêng.",
    last: "Lần trước",
    go: "tiếp tục →",
    fish: { snook: "Snook", pompano: "Pompano" }
  }
};
var lang = "en";
try { lang = localStorage.getItem("pf_lang") || "en"; } catch (e) {}
function render() {
  var S = STR[lang];
  document.documentElement.lang = lang;
  document.getElementById("q").textContent = S.q;
  document.getElementById("qsub").textContent = S.qsub;
  document.getElementById("langBtn").innerHTML = lang === "en" ? "<b>EN</b> | VI" : "EN | <b>VI</b>";
  var cont = document.getElementById("cont"), sp = null;
  try { sp = localStorage.getItem("ff_species"); } catch (e) {}
  if (sp === "snook" || sp === "pompano") {
    cont.innerHTML = S.last + ": <a href=\"" + sp + ".html\">" + S.fish[sp] + " " + S.go + "</a>";
  } else {
    cont.innerHTML = "";
  }
}
document.getElementById("langBtn").addEventListener("click", function() {
  lang = lang === "en" ? "vi" : "en";
  try { localStorage.setItem("pf_lang", lang); } catch (e) {}
  render();
});
render();
</script>
</body>
</html>
