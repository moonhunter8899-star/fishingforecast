<script>
"use strict";
/* Fixed header: spacer keeps page flow; sync after panel toggles/resize */
var stickyHeadEl = document.querySelector('.stickyhead');
var stickySpacerEl = null;
function syncSticky() {
if (!stickyHeadEl) return;
if (!stickySpacerEl) {
stickySpacerEl = document.createElement('div');
stickyHeadEl.parentNode.insertBefore(stickySpacerEl, stickyHeadEl);
}
stickySpacerEl.style.height = stickyHeadEl.offsetHeight + 'px';
}
syncSticky();
window.addEventListener('resize', syncSticky);
window.addEventListener('load', syncSticky);
setTimeout(syncSticky, 600);
/* ================= constants ================= */

/* ================= locations: GPS, search, saved spots ================= */
function distMi(lat1, lon1, lat2, lon2) {
var p = Math.PI / 180, a = Math.sin((lat2 - lat1) * p / 2), b = Math.sin((lon2 - lon1) * p / 2);
var h = a * a + Math.cos(lat1 * p) * Math.cos(lat2 * p) * b * b;
return 2 * 3959 * Math.asin(Math.sqrt(h));
}
function nearestStation(lat, lon) {
var best = null, bd = 1e9, i, t, d;
for (i = 0; i < TIDE_STATIONS.length; i++) {
t = TIDE_STATIONS[i]; d = distMi(lat, lon, t[1], t[2]);
if (d < bd) { bd = d; best = t[0]; }
}
return bd <= 45 ? best : null;
}

(state.sel === 0 ? ' · <span id="clock">' + clockStr(state.lang) + "</span>" : "") + "</div>" +
"</div></div>" +
"</div>";
// pick-a-day strip
var bestIdx = 0;
state.days.forEach(function(d, i) { if (d.score > state.days[bestIdx].score) bestIdx = i; });
html += '<div class="pick"><span class="ph">' + S.pickDay + "</span>" +
'<span class="pr">' + S.months[d0.date.getMonth()] + " " + d0.date.getDate() + " – " +
S.months[state.days[6].date.getMonth()] + " " + state.days[6].date.getDate() + "</span></div>";
html += '<div class="strip">';
state.days.forEach(function(d, i) {
var c = ratingColor(d.score);
var cls = "dpill" + (i === state.sel ? " sel" : "") + (i === bestIdx ? " best" : "");
var dw = i === 0 ? S.todayWord.toUpperCase() : S.days[d.date.getDay()];
html += '<div class="' + cls + '" data-day="' + i + '"' +
(i === state.sel ? ' style="background:' + c + '"' : "") + ">" +
(i === bestIdx ? '<span class="bestbadge">' + S.best + "</span>" : "") +
'<div class="dw">' + dw + '</div><div class="dn">' + d.date.getDate() + "</div>" +
'<div style="margin:2px 0">' + fishSVG(i === state.sel ? "#ffffff" : c, 22, 42) + "</div>" +
'<div class="dsc" style="color:' + (i === state.sel ? "#fff" : c) + '">' + d.score + "</div>" +
'<div class="dow2">' + ratingWord(d.score, state.lang) + "</div></div>";
});
html += "</div>";
// slim go-fish band: best window hours, vanishes once the window passes
var gfD = state.days[state.sel], gfW = gfD.best, gfNow = Date.now(), gfHTML = "";
if (gfW && gfW.end.getTime() > gfNow) {
var gfIn = "";
if (state.sel === 0) {
gfIn = gfW.start.getTime() > gfNow
? '<span class="gf-in" id="gfIn" data-start="' + gfW.start.getTime() + '">' + S.inFish(durText(gfW.start.getTime() - gfNow, state.lang)) + "</span>"
: '<span class="gf-in">' + S.nowFish + "</span>";
}
gfHTML = '<div class="gofish" id="gofish" data-end="' + gfW.end.getTime() + '">' +
fishSVG("#b3541e", 20) + "<span><b>" + S.goFish + "</b> \u00b7 " + trange(gfW.start, gfW.end, state.lang) + "</span>" + gfIn + "</div>";
}
html += gfHTML;
// day card
var day = state.days[state.sel];
var dc = ratingColor(day.score);
html += '<div class="card" style="border-color:' + dc + '">';
var cn = condIcon(day.condCode, day.condDay) + " " + (S.condName[day.condCode] || S.condName[2]);
var mph = (state.moonPhase && state.moonPhase[ymdDash(day.date)] != null) ? state.moonPhase[ymdDash(day.date)] : null;
var moonTile;
if (mph == null) {
moonTile = '<div class="tile"><div class="k">' + S.moon + '</div><div class="v">—</div></div>';
} else {
var mp = moonPhaseInfo(mph);
var msub = mp.daysToFull === 0 ? S.fullTonight : S.fullIn(mp.daysToFull);
moonTile = '<div class="tile"><div class="k">' + S.moon + '</div><div class="v">' + moonPhaseSVG(mph, 1.3) + " " +
Math.round(mp.illum * 100) + '%</div><div class="msub">' + msub + "</div></div>";
}
var sunTile = '<div class="tile"><div class="sundrow">' +
'<div><div class="k">' + S.sunrise + '</div><div class="v">' + (day.sunrise ? tstr(day.sunrise, state.lang) : "—") + "</div></div>" +
'<div class="sundiv"></div>' +
'<div><div class="k">' + S.sunset + '</div><div class="v">' + (day.sunset ? tstr(day.sunset, state.lang) : "—") + "</div></div>" +
"</div></div>";
html += '<div class="tiles">' +
'<div class="tile"><div class="k">' + _lblWind() + ' ' + S.wind + '</div><div class="v">' + day.wind + (day.gust != null ? " | " + day.gust : "") + " " + day.windDir + "</div></div>" +
'<div class="tile"><div class="k">' + _lblWater() + ' ' + S.water + '</div><div class="v">' + (day.water == null ? "\u2014" : day.water.toFixed(1) + "\u00b0F") + "</div></div>" +
'<div class="tile"><div class="k">' + S.cond + '</div><div class="v">' + cn + "</div></div>" +
'<div class="tile"><div class="k">' + _lblRain() + ' ' + S.rain + '</div><div class="v">' + day.rain + "%</div></div>" +
moonTile + sunTile +
"</div>";
// live precipitation radar with the day's score pinned at the spot
html += '<div class="radarcap"><div class="radarmap" id="radarmap"></div>' +
'<div class="radarbar"><span class="seg"><button id="modeWind" class="on">' + S.wind + '</button><button id="modeRadar">' + S.radar + '</button></span>' +
'<span id="radarFoot" class="radarfoot"></span>' +
'<span class="radarattr" id="radarAttr">\u00a9 OpenStreetMap \u00b7 RainViewer</span>' +
'<button class="radarplay" id="radarPlay" hidden>\u25b6</button></div></div>';
// major/minor — past windows disappear; countdown keeps pointing at the next bite
var moonRows = moonRowsHTML(day);
var moonSec = "";
if (moonRows) {
moonSec = '<div class="moonsec"><div class="mh">' + S.moonTitle + "</div>" +
'<p class="cdline" id="moonCd">' + moonCountdownHTML() + "</p>" +
'<div id="moonRows">' + moonRows + "</div></div>";
} else if (state.moon.some(function(w) { return w.end > day.date.getTime() && w.start < day.date.getTime() + 86400000; })) {
moonSec = '<div class="moonsec"><div class="mh">' + S.moonTitle + "</div>" +
'<p class="cdline" id="moonCd">' + moonCountdownHTML() + "</p></div>";
} else {
moonSec = '<div class="moonsec"><div class="mh">' + S.moonTitle + "</div>" +
'<p class="cdline">' + S.moonNote + "</p></div>";
}
html += moonSec;
// tide
html += '<div class="tidesec"><div class="th">🌊 ' + S.tide + " · " +
(state.sel === 0 ? S.todayWord : S.days[day.date.getDay()] + " " + day.date.getDate()) + "</div>" +
(state.tides.length
? '<p class="cdline" id="tideCd">' + tideCountdownHTML() + "</p>" +
tideSVG(day) + '<div class="tchips">' + tideChipsHTML(day) + "</div>"
: '<p class="cdline">' + S.tideNote + "</p>") + "</div>";
html += "</div>";
// hour-by-hour card for the selected day, after the tide chart
html += hourlyHTML(day);
app.innerHTML = html;
syncPastRows();
// wire buttons
var pills = app.querySelectorAll("[data-day]");
for (var i = 0; i < pills.length; i++) {
(function(el) {
el.addEventListener("click", function() { state.sel = +el.getAttribute("data-day"); renderAll(); });
})(pills[i]);
}
var cday = state.days[state.sel];
var cmn = $("catchMinus"), cpl = $("catchPlus");
if (cmn && cday) cmn.addEventListener("click", function() { bumpCatch(cday.date.getTime(), -1); });
if (cpl && cday) cpl.addEventListener("click", function() { bumpCatch(cday.date.getTime(), 1); });
initRadar();
}
function syncPastRows() {
var nowMs = Date.now(), rows = document.querySelectorAll('.htable tr.hrow[data-ms]');
for (var i = 0; i < rows.length; i++) {
var ms = +rows[i].getAttribute('data-ms');
if (ms + 3600000 <= nowMs) rows[i].classList.add('past');
else rows[i].classList.remove('past');
}
}
function tick() {
if (!state.ready) return;
var clk = $("clock");
if (clk) clk.textContent = clockStr(state.lang);
var mc = $("moonCd");
if (mc) mc.textContent = moonCountdownHTML();
var tc = $("tideCd");
if (tc) tc.textContent = tideCountdownHTML();
var mr = $("moonRows");
if (mr && state.days[state.sel]) {
var nr = moonRowsHTML(state.days[state.sel]);
if (nr) mr.innerHTML = nr; else mr.remove();
}
var gf = $("gofish");
if (gf) {
var gfn = Date.now(), gfe = +gf.getAttribute("data-end");
if (gfn >= gfe) { gf.remove(); }
else {
var gi = $("gfIn"), SS = STR[state.lang];
if (gi) gi.textContent = SS.inFish(durText(+gi.getAttribute("data-start") - gfn, state.lang));
}
}
renderHeader();
// if the phone's real clock has rolled past the rendered day (page left open
// across midnight), silently refetch so the rod, countdowns and scores match
// the real current day — never a stale or wrongly-placed marker
var nowMs = Date.now();
if (!state.loading && state.tideScale &&
(nowMs < state.tideScale.d0 || nowMs >= state.tideScale.d0 + 86400000)) {
startLoad();
return;
}
// move the live tide-chart rod every 30s so it rides the curve with the real time
syncPastRows();
if (++__tfN % 30 === 0) moveTideFish();
}
// repositions the #tiderod marker along the tide curve to the current time
var __tfN = 0;
function moveTideFish() {
var t = document.getElementById("tiderod"), sc = state.tideScale;
if (!t || !sc || !state.ready) return;
var now = Date.now(), d1 = sc.d0 + 86400000;
if (now < sc.d0 || now > d1) {
t.style.display = "none";
return;
}
t.style.display = "";
var fx = sc.pL + (now - sc.d0) / 86400000 * (sc.W - sc.pL - sc.pR);
var fy = sc.pT + (1 - (tideAt(now) - sc.mn) / (sc.mx - sc.mn)) * (sc.H - sc.pT - sc.pB);
t.setAttribute("transform", "translate(" + fx.toFixed(1) + "," + fy.toFixed(1) + ")");
var rt = document.getElementById("rodtim");
if (rt) rt.textContent = clockStr(state.lang);
}
function showError() {
var S = STR[state.lang];
$("app").innerHTML = '<div class="err">' + S.loadFail +
'<br><button class="refresh" onclick="boot(true)">' + S.retry + "</button></div>";
}
function dedupeMoon(wins) {
wins.sort(function(a, b) { return a.start - b.start; });
var out = [];
wins.forEach(function(w) {
var last = out[out.length - 1];
if (last && last.type === w.type && w.start <= last.end + 600000) {
last.end = Math.max(last.end, w.end);
} else out.push(w);
});
return out;
}
// Forecast for the selected location (Jupiter Inlet by default).
function startLoad() {
var L = state.loc;
var lat = L.lat, lon = L.lon, station = L.station;
state.loading = true;
try { localStorage.setItem("ff_species", "mackerel"); } catch (e) {}
renderHeader();
var fromD = new Date(); fromD.setDate(fromD.getDate() - 1);
var toD = new Date(); toD.setDate(toD.getDate() + 7);
var moonPs = [];
for (var i = 0; i < 8; i++) {
var dt = new Date(); dt.setDate(dt.getDate() + i);
moonPs.push(loadMoonDay(lat, lon, dt));
}
// Each source is independent: weather+marine are essential, but tides and moon
// degrade gracefully (quiet note instead of a full-page error).
Promise.all([
loadWeather(lat, lon).catch(function(e) { return { _err: e }; }),
loadMarine(lat, lon).catch(function(e) { return { _err: e }; }),
(station ? loadTides(station, fromD, toD).catch(function() { return []; }) : Promise.resolve([])),
Promise.all(moonPs)
])
.then(function(r) {
try {
if (r[0]._err || r[1]._err) { state.loading = false; showError(); return; }
var wx = r[0], mar = r[1];
state.wx = wx; state.mar = mar;
state.isOcean = mar.hourly.sea_surface_temperature.some(function(v) { return v != null && !isNaN(v); });
state.isShore = state.isOcean && (hasWaterOverride(state.loc) || (mar.hourly.wave_height || []).some(function(v) { return v != null && !isNaN(v); }));
if (state.isShore) { try { localStorage.setItem("ff_last_shore", JSON.stringify({ name: state.loc.name, lat: state.loc.lat, lon: state.loc.lon })); } catch (e) {} }
state.tides = r[2];
var all = [];
r[3].forEach(function(arr) { arr.forEach(function(w) { all.push(w); }); });
state.moon = dedupeMoon(all);
state.days = buildDays(wx, mar);
state.sel = 0;
state.ready = true; state.loading = false;
state.updatedAt = new Date();
renderAll();
} catch (e) { state.loading = false; showError(); }
})
.catch(function() { state.loading = false; showError(); });
}
function boot() {
state.ready = false; state.sel = 0; state.days = []; state.moonPhase = {};
var S = STR[state.lang];
document.documentElement.lang = state.lang;
$("app").innerHTML = '<div class="loading">' + S.loading + "</div>";
renderHeader();
startLoad(); // selected location (Jupiter Inlet default)
}
$("langBtn").addEventListener("click", function() {
state.lang = state.lang === "en" ? "vi" : "en";
localStorage.setItem("pf_lang", state.lang);
document.documentElement.lang = state.lang;
if (state.ready) renderAll(); else boot();
});
$("refBtn").addEventListener("click", function() { boot(); });
$("locName").addEventListener("click", function() {
var p = $("locPanel"); p.hidden = !p.hidden; syncSticky();
if (!p.hidden) { wireLocUI(); setTimeout(function() { $("locSearch").focus(); }, 60); }
});
$("locGPS").addEventListener("click", useMyLocation);
$("locGPS2").addEventListener("click", function() { $("locPanel").hidden = false; syncSticky(); wireLocUI(); useMyLocation(); });
$("locChange").addEventListener("click", function() {
var p = $("locPanel"); p.hidden = !p.hidden; syncSticky();
if (!p.hidden) { wireLocUI(); setTimeout(function() { $("locSearch").focus(); }, 60); }
});
$("locHome").addEventListener("click", function() { var _l = lastShore(); setLocation((_l && _l.name) ? _l : { name: PIN.name, lat: PIN.lat, lon: PIN.lon }); });
$("locSearch").addEventListener("input", function(e) {
clearTimeout(locSearchTimer);
var q = e.target.value;
locSearchTimer = setTimeout(function() { doSearch(q); }, 350);
});
boot();
setInterval(tick, 1000);
</script>
