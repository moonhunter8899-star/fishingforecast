/* Fixed header: spacer keeps page flow; sync after panel toggles/resize */
var stickyHeadEl = document.querySelector('.stickyhead');
var stickySpacerEl = null;
function syncSticky() {
if (!stickyHeadEl) return;
if (!stickySpacerEl) {
stickySpacerEl = document.createElement('div');
stickyHeadEl.parentNode.insertBefore(stickySpacerEl, stickyHeadEl);
}
stickySpacerEl.style.height = stickyHeadEl.offsetHeight + 'px';
}
syncSticky();
window.addEventListener('resize', syncSticky);
window.addEventListener('load', syncSticky);
setTimeout(syncSticky, 600);

/* Original line-art crescent moon with three sparkle stars (Tien's reference style).

function moonSVG(em) {
var s = em || 1.15, st = "#0f766e", sw = 2.2;
function spark(cx, cy, r) {
var k = +(r * 0.18).toFixed(2);
return '<path d="M' + cx + ' ' + (cy - r) +
' Q' + (cx + k) + ' ' + (cy - k) + ' ' + (cx + r) + ' ' + cy +
' Q' + (cx + k) + ' ' + (cy + k) + ' ' + cx + ' ' + (cy + r) +
' Q' + (cx - k) + ' ' + (cy + k) + ' ' + (cx - r) + ' ' + cy +
' Q' + (cx - k) + ' ' + (cy - k) + ' ' + cx + ' ' + (cy - r) + ' Z"/>';
}
return '<svg width="' + s + 'em" height="' + s + 'em" viewBox="0 0 32 32" ' +
'style="vertical-align:-0.18em" fill="none" stroke="' + st + '" stroke-width="' + sw + '" ' +
'stroke-linecap="round" stroke-linejoin="round">' +
'<path d="M13.7 6 A10 10 0 1 0 22.1 20.1 A8.2 8.2 0 0 1 13.7 6 Z"/>' +

'</svg>';
}
/* Dynamic moon-phase icon (~30px): dark disc + accurately-shaped lit portion,
drawn from the MET Norway moonphase angle (0=new, 90=first quarter,
180=full, 270=last quarter). The terminator is a half-ellipse with
semi-minor axis r*|cos(phase)|; waxing lights the right side, waning the left.
Lit: warm pale yellow; dark: deep slate — reads on the warm-sand theme. */
function moonPhaseSVG(deg, em) {
var th = ((((deg % 360) + 360) % 360) * Math.PI) / 180;
var r = 14, cx = 16, cy = 16;
var c = Math.cos(th);
if (Math.abs(c) < 1e-9) c = 0; // snap float noise at quarter points
var waxing = th <= Math.PI;
var rx = Math.abs(r * c).toFixed(2);
var outerSweep = waxing ? 1 : 0;
var termSweep = (c < 0) ? 1 : 0;
var s = em || 1.3;
var d = "M" + cx + " " + (cy - r) +
" A" + r + " " + r + " 0 0 " + outerSweep + " " + cx + " " + (cy + r) +
" A" + rx + " " + r + " 0 0 " + termSweep + " " + cx + " " + (cy - r) + " Z";
return '<svg width="' + s + 'em" height="' + s + 'em" viewBox="0 0 32 32" ' +
'style="vertical-align:-0.18em">' +
'<circle cx="16" cy="16" r="14" fill="#1f3a3a"/>' +
'<path d="' + d + '" fill="#f5e6b8"/>' +
'<circle cx="16" cy="16" r="13.2" fill="none" stroke="#0f766e" stroke-width="1.6"/>' +
'</svg>';
}
